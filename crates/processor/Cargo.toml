[package]
name = "rust_processor"
version.workspace = true
edition = "2024"
description = "Rust core and native desktop workspace for Script Hub rules and modules"
license = "GPL-3.0-only"
repository = "https://github.com/nowaytouse/script_hub"
readme = "README.md"
publish = false

[[bin]]
name = "script-hub-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "script-hub-relay"
path = "src/bin/relay.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:argon2", "dep:chacha20poly1305", "dep:getrandom", "dep:zeroize", "dep:url", "dep:libc", "dep:base64", "dep:serde-saphyr", "dep:hickory-proto", "dep:ipnet", "dep:age", "dep:rhai"]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
serde = "1.0"
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.13"
fancy-regex = "0.20.0"
once_cell = "1.21"
walkdir = "2.5.0"
psl = "2.1.246"
percent-encoding = "2.3"
chrono = "0.4"
md5 = "0.8"
ureq = { version = "3.5.1", features = ["socks-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1.9", optional = true, features = ["derive"] }
url = { version = "2.5", optional = true }
base64 = { version = "0.23.1", optional = true }
serde-saphyr = { version = "2.0", optional = true, default-features = false, features = ["serialize", "deserialize"] }
hickory-proto = { version = "0.26.3", optional = true, default-features = false, features = ["std"] }
ipnet = { version = "2.12.2", optional = true }
age = { version = "0.12.1", optional = true, default-features = false, features = ["armor"] }
rhai = { version = "1.27.0", optional = true, default-features = false, features = ["std", "no_module", "no_time"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sys-locale = "0.3.2"
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts"] }

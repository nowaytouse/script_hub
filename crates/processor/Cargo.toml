[package]
name = "rust_processor"
version.workspace = true
edition = "2024"
rust-version = "1.100"
description = "Rust core and native desktop workspace for Script Hub rules and modules"
license = "GPL-3.0-only"
repository = "https://github.com/nowaytouse/script_hub"
readme = "README.md"
publish = false

[[bin]]
name = "script-hub-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "script-hub-relay"
path = "src/bin/relay.rs"
required-features = ["gui"]

[features]
gui = [
    "dep:gpui",
    "dep:pathfinder_simd",
    "dep:unicode-segmentation",
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:zeroize",
    "dep:url",
    "dep:libc",
    "dep:serde-saphyr",
    "dep:hickory-proto",
    "dep:age",
    "dep:rhai",
]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.13"
fancy-regex = "0.20.2"
once_cell = "1.21"
walkdir = "2.5.1"
psl = "2.1.261"
percent-encoding = "2.3"
chrono = "0.4"
md5 = "0.8"
maxminddb = { version = "0.33", default-features = false }
mmdb-writer = "0.1.0"
sha2 = "0.11"
ureq = { version = "3.5.2", features = ["socks-proxy"] }
rusqlite = { version = "0.43", features = ["bundled"] }
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1.9", optional = true, features = ["derive"] }
url = { version = "2.5", optional = true }
base64 = "0.23.1"
serde-saphyr = { version = "2.2", optional = true, default-features = false, features = ["serialize", "deserialize"] }
hickory-proto = { version = "0.26.3", optional = true, default-features = false, features = ["std"] }
ipnet = "2.12.2"
# Temporary security hold: age 0.12 pulls in the P-256 path affected by RUSTSEC-2026-0387.
age = { version = "=0.11.5", optional = true, default-features = false, features = ["armor"] }
rhai = { version = "1.27.0", optional = true, default-features = false, features = ["std", "no_module", "no_time"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Pathfinder's ARM backend uses LLVM intrinsics that break on current nightlies.
# https://github.com/rust-lang/rust/issues/165959
pathfinder_simd = { version = "0.5.6", optional = true, features = ["pf-no-simd"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sys-locale = "0.3.2"
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["windows-manifest"] }
unicode-segmentation = { version = "1.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Without font-kit, GPUI silently selects NoopTextSystem and paints no glyphs.
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["font-kit"] }

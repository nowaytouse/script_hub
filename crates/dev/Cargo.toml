[package]
name = "script_hub_dev"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "smart_build"
path = "src/main.rs"

[[bin]]
name = "icons"
path = "src/bin/icons.rs"
required-features = ["icon-tools"]

[features]
icon-tools = ["dep:resvg"]

[dependencies]
resvg = { version = "0.49.0", optional = true, default-features = false }
editpe = { version = "0.2.4", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

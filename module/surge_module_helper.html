let copiedModules = JSON.parse(localStorage.getItem('surge_copied_modules') || '{}');
function getModules() { return currentApp === 'shadowrocket' && typeof srModules !== 'undefined' ? srModules : surgeModules; }
let currentFilter = 'all';
function saveProgress() { localStorage.setItem('surge_copied_modules', JSON.stringify(copiedModules)); updateStats(); }
function updateStats() { let total = 0, copied = 0, srCompat = 0, standalone = 0; const mods = getModules(); Object.values(mods).forEach(cat => { total += cat.items.length; cat.items.forEach(m => { if (copiedModules[m.url]) copied++; if (m.srCompat) srCompat++; if (!m.merged && !m.hasmerged) standalone++; }); }); document.getElementById('totalCount').textContent = total; document.getElementById('copiedCount').textContent = copied; document.getElementById('remainCount').textContent = total - copied; document.getElementById('standaloneCount').textContent = standalone; if (currentApp === 'surge') { document.getElementById('srCompatCount').textContent = srCompat; document.getElementById('srCompatCount').parentElement.style.display = ''; } else { document.getElementById('srCompatCount').parentElement.style.display = 'none'; } }
function switchApp(app) { currentApp = app; document.querySelectorAll('.app-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.app === app)); document.getElementById('pageTitle').textContent = app === 'surge' ? '⚡ Surge模块导入助手' : '🚀 Shadowrocket模块导入助手'; document.getElementById('pageSubtitle').textContent = app === 'surge' ? '点击复制URL → 粘贴到Surge「从URL安装模块」→ 自动记录进度' : '点击复制URL → 粘贴到Shadowrocket「配置-模块-添加模块」→ 自动记录进度'; document.getElementById('compatLegend').style.display = app === 'surge' ? '' : 'none'; document.getElementById('srNotice').classList.toggle('show', app === 'shadowrocket'); renderModules(); updateStats(); }
async function copyUrl(url, btn) { try { await navigator.clipboard.writeText(url); } catch (e) { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); } copiedModules[url] = Date.now(); saveProgress(); btn.textContent = '✓ 已复制'; btn.classList.add('copied'); btn.closest('.module').classList.add('copied'); showToast('已复制到剪贴板'); renderModules(); }
function showToast(msg) { const existing = document.querySelector('.toast'); if (existing) existing.remove(); const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 1500); }
function resetProgress() { if (confirm('确定要重置所有进度吗？')) { copiedModules = {}; localStorage.removeItem('surge_copied_modules'); location.reload(); } }
function toggleCategory(el) { el.closest('.category').classList.toggle('collapsed'); }
function setFilter(filter) { currentFilter = filter; document.querySelectorAll('.filter-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.filter === filter); }); renderModules(); }
function filterModules() { renderModules(); }
function renderModules() { const searchTerm = document.getElementById('searchInput').value.toLowerCase(); const container = document.getElementById('moduleList'); container.innerHTML = ''; const mods = getModules(); Object.entries(mods).forEach(([catKey, cat]) => { let visibleItems = cat.items.filter(m => { const matchSearch = !searchTerm || m.name.toLowerCase().includes(searchTerm) || (m.desc && m.desc.toLowerCase().includes(searchTerm)); if (!matchSearch) return false; const isCopied = !!copiedModules[m.url]; switch(currentFilter) { case 'uncopied': return !isCopied; case 'copied': return isCopied; case 'essential': return m.essential; case 'merged': return m.merged; case 'standalone': return !m.merged && !m.hasmerged; case 'sr-compat': return currentApp === 'surge' && m.srCompat === true; case 'bilibili': return m.tag === 'bilibili'; case 'youtube': return m.tag === 'youtube'; default: return true; } }); if (visibleItems.length === 0) return; const copiedInCat = visibleItems.filter(m => copiedModules[m.url]).length; const catEl = document.createElement('div'); catEl.className = 'category'; catEl.innerHTML = '<div class="category-header" onclick="toggleCategory(this)"><span class="category-title">' + cat.name + '</span><span class="category-count">' + visibleItems.length + '</span><span class="category-progress">' + copiedInCat + '/' + visibleItems.length + '</span><span class="category-toggle">▼</span></div><div class="modules"></div>'; const modulesEl = catEl.querySelector('.modules'); visibleItems.forEach(m => { const isCopied = !!copiedModules[m.url]; let compatBadge = ''; if (currentApp === 'surge') { compatBadge = m.srCompat ? '<span class="compat-badge both" title="Surge + Shadowrocket 双兼容">🚀✓</span>' : '<span class="compat-badge surge-only" title="仅Surge' + (m.srIssues ? ': ' + m.srIssues.join(', ') : '') + '">Surge</span>'; } let tags = ''; if (m.merged) tags += '<span class="tag merged" title="推荐使用此合集版本">📦合集</span>'; if (m.hasmerged) tags += '<span class="tag hasmerged" title="此模块已合并到大合集，推荐使用合集版">有合集版</span>'; if (!m.merged && !m.hasmerged) tags += '<span class="tag standalone" title="独立模块，未包含在任何合集中">🔮独立</span>'; if (m.tag) tags += '<span class="tag ' + m.tag + '">' + m.tag + '</span>'; const moduleEl = document.createElement('div'); moduleEl.className = 'module' + (isCopied ? ' copied' : '') + (m.essential ? ' essential' : '') + (m.recommended ? ' recommended' : '') + (m.hasmerged ? ' hasmerged' : '') + (m.merged ? ' merged-collection' : ''); let excludedHtml = ''; if (m.merged && m.excludedModules && m.excludedModules.length > 0) { excludedHtml = '<div class="excluded-list"><div class="excluded-title">⚠️ 未包含以下模块 (需单独安装):</div><div class="excluded-items">' + m.excludedModules.join(' · ') + '</div></div>'; } moduleEl.innerHTML = (m.merged ? '<div class="module-row">' : '') + '<div class="module-info"><div class="module-name">' + (m.essential ? '⭐ ' : '') + (m.merged ? '📦 ' : '') + m.name + compatBadge + '</div><div class="module-desc">' + (m.desc || '') + '</div></div>' + tags + '<button class="copy-btn' + (isCopied ? ' copied' : '') + '" onclick="copyUrl(\'' + m.url.replace(/'/g, "\\'") + '\', this)">' + (isCopied ? '✓ 已复制' : '复制') + '</button>' + (m.merged ? '</div>' : '') + excludedHtml; modulesEl.appendChild(moduleEl); }); container.appendChild(catEl); }); }
renderModules(); updateStats();

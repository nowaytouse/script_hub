<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试 - Surge模块导入助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .module { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 8px 0; }
        .module-info { flex: 1; }
        .copy-btn { background: rgba(33,150,243,0.5); border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .copy-btn:hover { background: rgba(33,150,243,0.7); }
        .debug { background: rgba(255,255,0,0.1); padding: 10px; margin: 10px 0; border: 1px solid yellow; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 调试模式</h1>
    <div class="debug" id="debug"></div>
    <div id="moduleList"></div>
</div>
<script>
const surgeModules = {"amplify_nexus": {"name": "🛠️ Amplify Nexus", "items": [
    {"name": "测试模块1", "desc": "测试描述1", "url": "https://example.com/1.sgmodule"},
    {"name": "测试模块2", "desc": "测试描述2", "url": "https://example.com/2.sgmodule"}
]}};

const debug = document.getElementById('debug');
debug.innerHTML = '<strong>调试信息:</strong><br>';

debug.innerHTML += `模块数据: ${JSON.stringify(surgeModules, null, 2)}<br>`;
debug.innerHTML += `amplify_nexus items数量: ${surgeModules.amplify_nexus.items.length}<br>`;

function renderModules() {
    const container = document.getElementById('moduleList');
    debug.innerHTML += '开始渲染...<br>';
    
    Object.entries(surgeModules).forEach(([catKey, cat]) => {
        debug.innerHTML += `处理分类: ${catKey}, 模块数: ${cat.items.length}<br>`;
        
        cat.items.forEach((m, idx) => {
            debug.innerHTML += `  - 模块${idx}: ${m.name}, URL: ${m.url ? '有' : '无'}<br>`;
            
            const moduleEl = document.createElement('div');
            moduleEl.className = 'module';
            
            const buttonHTML = `<button class="copy-btn" onclick="alert('复制: ${m.url}')">复制</button>`;
            debug.innerHTML += `    按钮HTML: ${buttonHTML.substring(0, 50)}...<br>`;
            
            moduleEl.innerHTML = `
                <div class="module-info">
                    <div><strong>${m.name}</strong></div>
                    <div style="font-size: 0.9em; color: #aaa;">${m.desc}</div>
                </div>
                ${buttonHTML}
            `;
            
            container.appendChild(moduleEl);
        });
    });
    
    debug.innerHTML += `渲染完成，容器子元素数: ${container.children.length}<br>`;
}

renderModules();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>复制按钮测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
        .module { background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; gap: 10px; align-items: center; }
        .copy-btn { background: rgba(33,150,243,0.5); border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .copy-btn:hover { background: rgba(33,150,243,0.7); }
        .copy-btn.copied { background: rgba(76,175,80,0.5); }
    </style>
</head>
<body>
    <h1>复制按钮测试</h1>
    <div class="module">
        <div style="flex: 1;">
            <div><strong>测试模块 1</strong></div>
            <div style="font-size: 0.9em; color: #aaa;">这是一个测试模块</div>
        </div>
        <button class="copy-btn" onclick="copyUrl('https://example.com/module1.sgmodule', this)">复制</button>
    </div>
    <div class="module">
        <div style="flex: 1;">
            <div><strong>测试模块 2</strong></div>
            <div style="font-size: 0.9em; color: #aaa;">另一个测试模块</div>
        </div>
        <button class="copy-btn" onclick="copyUrl('https://example.com/module2.sgmodule', this)">复制</button>
    </div>
    
    <script>
        async function copyUrl(url, btn) {
            try {
                await navigator.clipboard.writeText(url);
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                alert('已复制: ' + url);
            } catch (e) {
                alert('复制失败: ' + e.message);
            }
        }
    </script>
</body>
</html>

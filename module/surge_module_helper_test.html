            padding: 20px; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { color: rgba(255,255,255,0.8); font-size: 0.95em; }
        
        /* Stats */
        .stats { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
        }
        .stat-card { 
            background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(10px);
            padding: 15px 25px; 
            border-radius: 15px; 
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-num { font-size: 2em; font-weight: bold; }
        .stat-label { font-size: 0.85em; opacity: 0.9; margin-top: 5px; }
        
        /* App Switcher */
        .app-switcher { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .app-btn { 
            background: rgba(255,255,255,0.1); 
            border: 2px solid rgba(255,255,255,0.3); 
            color: #fff; 
            padding: 12px 30px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1em; 
            font-weight: 600;
            transition: all 0.3s;
        }
        .app-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: translateY(-2px);
        }
        .app-btn.active { 
            background: rgba(255,255,255,0.3); 
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        /* Search */
        .search-box { 
            max-width: 500px; 
            margin: 0 auto 25px; 
        }
        .search-box input { 
            width: 100%; 
            padding: 15px 20px; 
            border-radius: 25px; 
            border: 2px solid rgba(255,255,255,0.3); 
            background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(10px);
            color: #fff; 
            font-size: 1em;
            transition: all 0.3s;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.6); }
        .search-box input:focus { 
            outline: none; 
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
        }
        
        /* Actions */
        .actions { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
        }
        .action-btn { 
            background: rgba(244,67,54,0.3); 
            border: none; 
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .action-btn:hover { 
            background: rgba(244,67,54,0.5); 
            transform: translateY(-2px);
        }
        
        /* Category */
        .category { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            margin-bottom: 20px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .category-header { 
            display: flex; 
            align-items: center; 
            padding: 20px 25px; 
            cursor: pointer;
            transition: background 0.3s;
        }
        .category-header:hover { background: rgba(255,255,255,0.05); }
        .category-title { 
            flex: 1; 
            font-size: 1.3em; 
            font-weight: 600; 
        }
        .category-count { 
            background: rgba(255,255,255,0.2); 
            padding: 5px 15px; 
            border-radius: 15px; 
            font-size: 0.9em;
            margin-right: 10px;
        }
        .category-toggle { 
            font-size: 1.2em; 
            transition: transform 0.3s; 
        }
        .category.collapsed .category-toggle { transform: rotate(-90deg); }
        .category.collapsed .modules { display: none; }
        
        /* Modules */
        .modules { 
            padding: 0 25px 25px; 
            display: grid; 
            gap: 12px; 
        }
        .module { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 15px 20px; 
            background: rgba(255,255,255,0.08); 
            border-radius: 15px;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .module:hover { 
            background: rgba(255,255,255,0.15); 
            transform: translateX(5px);
        }
        .module.copied { 
            background: rgba(76,175,80,0.2); 
            border-color: rgba(76,175,80,0.4);
        }
        .module.essential { 
            border-color: rgba(255,193,7,0.5); 
            background: rgba(255,193,7,0.1);
        }
        
        .module-info { flex: 1; min-width: 0; }
        .module-name { 
            font-weight: 600; 
            font-size: 1em; 
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .module-desc { 
            color: rgba(255,255,255,0.7); 
            font-size: 0.85em; 
            line-height: 1.4;
        }
        
        /* Tags */
        .tags { 
            display: flex; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        .tag { 
            font-size: 0.7em; 
            padding: 3px 8px; 
            border-radius: 10px; 
            background: rgba(255,255,255,0.15);
            white-space: nowrap;
        }

        .tag.tool { background: rgba(156,39,176,0.3); }
        .tag.bilibili { background: rgba(251,114,153,0.3); }
        .tag.youtube { background: rgba(255,0,0,0.3); }

        .copy-btn { 
            background: rgba(33,150,243,0.4); 
            border: none; 
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .copy-btn:hover { 
            background: rgba(33,150,243,0.6); 
            transform: scale(1.05);
        }
        .copy-btn.copied { 
            background: rgba(76,175,80,0.5); 
        }
        
        /* Toast */
        .toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.9); 
            color: #fff; 
            padding: 15px 30px; 
            border-radius: 25px; 
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateX(-50%) translateY(20px); } 
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* Footer */
        .footer { 
            text-align: center; 
            margin-top: 40px; 
            color: rgba(255,255,255,0.6); 
            font-size: 0.85em; 
        }
    </style>

// ============================================================================
// 状态管理
// ============================================================================
let currentApp = 'surge';
let copiedModules = JSON.parse(localStorage.getItem('module_copied') || '{}');

// ============================================================================
// 工具函数
// ============================================================================
function saveProgress() {
    localStorage.setItem('module_copied', JSON.stringify(copiedModules));
    updateStats();
}

function updateStats() {
    const modules = getModules();
    let total = 0, copied = 0;
    
    Object.values(modules).forEach(cat => {
        total += cat.items.length;
        cat.items.forEach(m => {
            if (copiedModules[m.url]) copied++;
        });
    });
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('copiedCount').textContent = copied;
    document.getElementById('remainCount').textContent = total - copied;
}

function getModules() {
    return currentApp === 'surge' ? MODULES_DATA.surge : MODULES_DATA.shadowrocket;
}

function switchApp(app) {
    currentApp = app;
    
    // 更新按钮状态
    document.querySelectorAll('.app-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.app === app);
    });
    
    // 更新标题
    if (app === 'surge') {
        document.getElementById('pageTitle').textContent = '⚡ Surge 模块导入助手';
        document.getElementById('pageSubtitle').textContent = '点击复制按钮 → 粘贴到 Surge「从URL安装模块」→ 自动记录进度';
    } else {
        document.getElementById('pageTitle').textContent = '🚀 Shadowrocket 模块导入助手';
        document.getElementById('pageSubtitle').textContent = '点击复制按钮 → 粘贴到 Shadowrocket「配置-模块-添加模块」→ 自动记录进度';
    }
    
    renderModules();
    updateStats();
}

async function copyUrl(url, btn) {
    try {
        await navigator.clipboard.writeText(url);
    } catch (e) {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
    }
    
    // 记录已复制
    copiedModules[url] = Date.now();
    saveProgress();
    
    // 更新按钮状态
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    btn.closest('.module').classList.add('copied');
    
    // 显示提示
    showToast('✓ 已复制到剪贴板');
    
    // 重新渲染以更新其他地方的状态
    renderModules();
}

function showToast(message) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.remove(), 2000);
}

function resetProgress() {
    if (confirm('确定要重置所有复制进度吗？')) {
        copiedModules = {};
        localStorage.removeItem('module_copied');
        renderModules();
        updateStats();
        showToast('✓ 进度已重置');
    }
}

function toggleCategory(el) {
    el.closest('.category').classList.toggle('collapsed');
}

// ============================================================================
// 渲染函数
// ============================================================================
function renderModules() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('moduleList');
    container.innerHTML = '';
    
    const modules = getModules();
    
    Object.entries(modules).forEach(([catKey, cat]) => {
        // 过滤模块
        const visibleItems = cat.items.filter(m => {
            if (!searchTerm) return true;
            return m.name.toLowerCase().includes(searchTerm) || 
                   (m.desc && m.desc.toLowerCase().includes(searchTerm));
        });
        
        if (visibleItems.length === 0) return;
        
        // 创建分类
        const categoryEl = document.createElement('div');
        categoryEl.className = 'category';
        
        const copiedCount = visibleItems.filter(m => copiedModules[m.url]).length;
        
        categoryEl.innerHTML = `
            <div class="category-header" onclick="toggleCategory(this)">
                <div class="category-title">${cat.name}</div>
                <div class="category-count">${copiedCount}/${visibleItems.length}</div>
                <div class="category-toggle">▼</div>
            </div>
            <div class="modules"></div>
        `;
        
        const modulesContainer = categoryEl.querySelector('.modules');
        
        // 渲染模块
        visibleItems.forEach(m => {
            const isCopied = !!copiedModules[m.url];
            
            const moduleEl = document.createElement('div');
            moduleEl.className = 'module' + (isCopied ? ' copied' : '') + (m.essential ? ' essential' : '');
            
            // 构建标签
            let tagsHtml = '';
            if (m.essential) tagsHtml += '<span class="tag essential">⭐必装</span>';
            if (m.tag) tagsHtml += `<span class="tag ${m.tag}">${m.tag}</span>`;
            
            moduleEl.innerHTML = `
                <div class="module-info">
                    <div class="module-name">
                        ${m.essential ? '⭐ ' : ''}${m.name}
                    </div>
                    <div class="module-desc">${m.desc || ''}</div>
                </div>
                ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
                <button class="copy-btn ${isCopied ? 'copied' : ''}" onclick="copyUrl('${m.url.replace(/'/g, "\\'")}', this)">
                    ${isCopied ? '✓ 已复制' : '复制'}
                </button>
            `;
            
            modulesContainer.appendChild(moduleEl);
        });
        
        container.appendChild(categoryEl);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('updateTime').textContent = MODULES_DATA.generated || '未知';
    renderModules();
    updateStats();
});

    document.getElementById('updateTime').textContent = MODULES_DATA.generated || '未知';
    renderModules();
    updateStats();
}

# smartdns-rs Configuration — Standalone Mainland China Accelerator for Surge
# Version: 2026.04.19-standalone
#
# ══════════════════════════════════════════════════════════════════════
# Purpose: Focus exclusively on Mainland China DNS acceleration.
# Usage: Set Surge [Host] or [General] DNS to 127.0.0.1:6053 for CN domains.
# ══════════════════════════════════════════════════════════════════════

# ── Logging ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4
audit-enable no

# ── Cache & Performance ────────────────────────────────────────────────
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
rr-ttl-min 60
rr-ttl-max 86400

# ── IP Selection & Speed Check ────────────────────────────────────────
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15
response-mode first-ping
speed-check-mode ping,tcp:443,tcp:80

# ── Bootstrap DNS (System Direct) ─────────────────────────────────────
# Used only to resolve DoH upstream hostnames at startup.
server 223.5.5.5        -bootstrap-dns
server 119.29.29.29     -bootstrap-dns
server [2400:3200::1]:53  -bootstrap-dns

# ── Listen Port ───────────────────────────────────────────────────────
# Listening on 6053 to avoid conflicts and maintain visibility for Surge.
bind     127.0.0.1:6053 -group cn
bind-tcp 127.0.0.1:6053 -group cn
bind     [::1]:6053     -group cn
bind-tcp [::1]:6053     -group cn

# ── Mainland Upstreams (CN Bucket) ────────────────────────────────────
# SmartDNS queries all of these concurrently and returns the fastest IP.
server-https https://dns.alidns.com/dns-query -group cn -exclude-default-group
server-https https://doh.pub/dns-query -group cn -exclude-default-group
server-https https://dns.pub/dns-query -group cn -exclude-default-group

# ── Logic ─────────────────────────────────────────────────────────────
# Do not add international upstreams here. Surge handles global/proxy DNS.
# This keeps SmartDNS lightweight and specialized for low-latency CN IPs.
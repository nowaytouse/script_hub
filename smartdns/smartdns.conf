# smartdns-rs Configuration — V44.8 Ultimate Unified Edition
# ══════════════════════════════════════════════════════════════════════

log-level info
log-file /tmp/smartdns.log
audit-enable yes
audit-log /tmp/smartdns_audit.log
audit-size 1M

cache-size 65535
prefetch-domain yes
serve-expired yes
dual-stack-ip-selection yes

# ── Surge Compatibility: Zero Latency ──
speed-check-mode none
force-qtype-soa 65

# ── Listen ──
bind 127.0.0.1:6053

# ── Static Mappings (Host Lock) ──
address /dns.alidns.com/223.5.5.5
address /dns.alidns.com/223.6.6.6
address /doh.pub/1.12.12.12
address /doh.pub/120.53.53.53
address /wikimedia-dns.org/103.102.166.224
address /doh.dns.apple.com/17.253.144.10

# ── Bootstrap ──
bootstrap-dns udp://223.5.5.5
bootstrap-dns udp://119.29.29.29
bootstrap-dns udp://2400:3200::1
bootstrap-dns udp://2402:4e00::

# ── Upstream: Group [cn] (Hybrid Master) ──
server-https https://dns.alidns.com/dns-query -group cn
server-https https://1.12.12.12/dns-query -group cn
server-https https://120.53.53.53/dns-query -group cn
server-tls dns.alidns.com -group cn
server-tls 1.12.12.12 -group cn
server-tls 120.53.53.53 -group cn
server 223.5.5.5 -group cn
server 119.29.29.29 -group cn
server 2400:3200::1 -group cn
server 2402:4e00:: -group cn

# ── Upstream: DOH Direct ──
server-https https://doh.dns.apple.com/dns-query -group apple

# ── Upstreams: DOH over SOCKS5 (Privacy & Specific Tuning) ──
server-https https://wikimedia-dns.org/dns-query -group nsfw -proxy socks5://127.0.0.1:6153
server-https https://dns.quad9.net/dns-query -group quad9 -proxy socks5://127.0.0.1:6153
server-https https://cloudflare-dns.com/dns-query -group cloudflare -proxy socks5://127.0.0.1:6153
server-https https://dns.twnic.tw/dns-query -group twnic -proxy socks5://127.0.0.1:6153
server-https https://dns.adguard-dns.com/dns-query -group adguard -proxy socks5://127.0.0.1:6153

# default proxy pool (for unmatched domains)
server-https https://dns.google/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://cloudflare-dns.com/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://dns.quad9.net/dns-query -group proxy -proxy socks5://127.0.0.1:6153

# ── Domain Sets (Auto-generated by python script) ──
domain-set -name cn_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn.txt
domain-set -name nsfw_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/nsfw.txt
domain-set -name apple_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/apple.txt
domain-set -name ms_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/microsoft.txt
domain-set -name aicf_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/ai_cf.txt
domain-set -name tw_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/tw.txt
domain-set -name social_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/social.txt

# ── Fine-grained Routing Strategy ──

# 国内专线
domain-rules /domain-set:cn_list/ -nameserver cn
domain-rules /baidu.com/ -nameserver cn
domain-rules /shifen.com/ -nameserver cn

# 特化隧道 (还原 MosDNS 分流架构)
domain-rules /domain-set:apple_list/ -nameserver apple
domain-rules /domain-set:ms_list/ -nameserver quad9
domain-rules /domain-set:aicf_list/ -nameserver cloudflare
domain-rules /domain-set:tw_list/ -nameserver twnic
domain-rules /domain-set:social_list/ -nameserver adguard
domain-rules /domain-set:nsfw_list/ -nameserver nsfw
domain-rules /nhentai.net/ -nameserver nsfw

# 兜底：其余未知一律走海外多线路节点容灾
domain-rules /./ -nameserver proxy

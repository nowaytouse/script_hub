# smartdns-rs Configuration — V18.1 DoT Aligned
# ══════════════════════════════════════════════════════════════════════

# ── General ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
cache-size 16383
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400

# ── Listen (V18.1: UDP 6053 / DoT 6443) ─────────────────────────────
# [Standard UDP]
bind 127.0.0.1:6053 -protocol udp
bind [::1]:6053 -protocol udp

# [DoT Endpoint: Clean Binary Flow for Surge]
bind-tls 127.0.0.1:6443
bind-tls [::1]:6443
bind-cert-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/smartdns.crt
bind-cert-key-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/smartdns.key

# ── Bootstrap ─────────────────────────────────────────────────────────
server 223.5.5.5               -bootstrap-dns
server 8.8.8.8                 -bootstrap-dns

# ── Upstream Cluster ──────────────────────────────────────────────────
server 223.5.5.5               -group cn_cluster
server 119.29.29.29            -group cn_cluster
server-https https://8.8.8.8/dns-query -group proxy_intl -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group proxy_intl -proxy socks5://127.0.0.1:6153

# ── Routing Rules ─────────────────────────────────────────────────────
domain-set -name cn_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn.txt
domain-rules /domain-set:cn_list/ -nameserver cn_cluster
domain-rules /./                  -nameserver cn_cluster -nameserver proxy_intl

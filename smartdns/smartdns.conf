# ── Routing Rules (Soul Restoration: MosDNS 1:1 Matrix) ────────────────

# 1. Bootstrap 自举域名 (最高优先级，锁定 proxy_intl 以避免国内干扰)
domain-rules /domain-set:bootstrap_list/ -nameserver proxy_intl

# 2. NSFW
domain-rules /domain-set:nsfw_list/      -nameserver nsfw

# 3. TikTok
domain-rules /domain-set:tiktok_list/    -nameserver tiktok

# 4. Airport
domain-rules /domain-set:airport_list/   -nameserver airport

# 5. Apple
domain-rules /domain-set:apple_list/     -nameserver apple

# 6. Google
domain-rules /domain-set:google_list/    -nameserver google

# 7. GitHub
domain-rules /domain-set:github_list/    -nameserver github

# 8. Microsoft
domain-rules /domain-set:ms_list/        -nameserver microsoft

# 9. AI / Cloudflare
domain-rules /domain-set:ai_cf_list/     -nameserver ai_cf

# 10. TW / Taiwan
domain-rules /domain-set:tw_list/        -nameserver tw

# 11. Social Media
domain-rules /domain-set:social_list/    -nameserver social

# 12/13. Ali & Tencent Specific (1:1 响应)
domain-rules /alicdn.com/               -nameserver ali_group
domain-rules /aliyun.com/               -nameserver ali_group
domain-rules /qq.com/                    -nameserver tencent_group
domain-rules /tencent.com/               -nameserver tencent_group

# 14. 国内常规分流 (cn.txt)
domain-rules /domain-set:cn_list/        -nameserver cn_cluster

# 15. 兜底路由 (双轨并行 + IP 回路重定向)
domain-rules /./                       -nameserver cn_cluster -nameserver google -nameserver proxy_intl

# 4. 安全回路补丁 (核心逻辑复刻)
# 只要国内 DNS 抢跑回的是大陆 IP -> 放行。
# 只要返回的是国外 IP -> 丢弃，等待纯正 DoH 结果。
ip-rules /ip-set:cn_ip/ -nameserver cn_cluster
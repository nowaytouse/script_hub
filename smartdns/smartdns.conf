# smartdns-rs Configuration — Full Fine-Grained & Robust IP-DoH Matrix
# ══════════════════════════════════════════════════════════════════════

# ── General ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400

# ── Performance ───────────────────────────────────────────────────────
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15
response-mode first-ping
speed-check-mode ping,tcp:443,tcp:80

# ── Listen ────────────────────────────────────────────────────────────
bind     127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind     [::1]:6053
bind-tcp [::1]:6053

# ── Bootstrap (UDP Only) ──────────────────────────────────────────────
# 补全全量 DoH 端点 IP 的自举解析能力
server 223.5.5.5             -bootstrap-dns
server 119.29.29.29          -bootstrap-dns
server 8.8.8.8               -bootstrap-dns
server 8.8.4.4               -bootstrap-dns
server 1.1.1.1               -bootstrap-dns
server 1.0.0.1               -bootstrap-dns
server 9.9.9.9               -bootstrap-dns

# ── Upstream Nameservers (Full IP-DoH Matrix with Redundancy) ─────────

# 【CN】— 境内加速
server-https https://223.5.5.5/dns-query -group cn
server-https https://1.12.12.12/dns-query -group cn
server 223.6.6.6  -group cn
server 119.29.29.29 -group cn

# 【Apple】
server-https https://17.253.144.10/dns-query -group apple

# 【Google】
server-https https://8.8.8.8/dns-query -group google -proxy socks5://127.0.0.1:6153
server-https https://8.8.4.4/dns-query -group google -proxy socks5://127.0.0.1:6153
server-https https://[2001:4860:4860::8888]/dns-query -group google -proxy socks5://127.0.0.1:6153

# 【MS / Microsoft】
server-https https://9.9.9.9/dns-query -group microsoft -proxy socks5://127.0.0.1:6153
server-https https://149.112.112.112/dns-query -group microsoft -proxy socks5://127.0.0.1:6153

# 【AI & Cloudflare】
server-https https://1.1.1.1/dns-query -group ai_cf -proxy socks5://127.0.0.1:6153
server-https https://1.0.0.1/dns-query -group ai_cf -proxy socks5://127.0.0.1:6153
server-https https://[2606:4700:4700::1111]/dns-query -group ai_cf -proxy socks5://127.0.0.1:6153

# 【Social Media】— 冗余化
server-https https://8.8.8.8/dns-query -group social -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group social -proxy socks5://127.0.0.1:6153

# 【TikTok】— 冗余化
server-https https://1.1.1.1/dns-query -group tiktok -proxy socks5://127.0.0.1:6153
server-https https://8.8.8.8/dns-query -group tiktok -proxy socks5://127.0.0.1:6153

# 【GitHub】
server-https https://8.8.8.8/dns-query -group github -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group github -proxy socks5://127.0.0.1:6153

# 【TW / Taiwan】
server-https https://101.101.101.101/dns-query -group tw -proxy socks5://127.0.0.1:6153

# 【JP / Japan】
server-https https://8.8.8.8/dns-query -group jp -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group jp -proxy socks5://127.0.0.1:6153

# 【Airport】

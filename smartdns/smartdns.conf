# smartdns-rs Configuration — Security-Hardened Split DNS
# ══════════════════════════════════════════════════════════════════════

# ── General ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
rr-ttl-min 60
rr-ttl-max 86400

# ── Performance ───────────────────────────────────────────────────────
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15
response-mode first-ping
speed-check-mode ping,tcp:443,tcp:80

# ── Listen ────────────────────────────────────────────────────────────
bind     127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind     [::1]:6053
bind-tcp [::1]:6053

# ── Bootstrap (UDP Only) ──────────────────────────────────────────────
server 223.5.5.5             -bootstrap-dns
server 2400:3200::1          -bootstrap-dns
server 119.29.29.29          -bootstrap-dns
server 2402:4e00::           -bootstrap-dns
server 1.1.1.1               -bootstrap-dns
server 8.8.8.8               -bootstrap-dns

# ── Upstream Groups ───────────────────────────────────────────────────

# 【CN】— 境内加速
server-https https://dns.alidns.com/dns-query -group cn
server-https https://doh.pub/dns-query -group cn
server 223.6.6.6  -group cn
server 119.29.29.29 -group cn

# 【Apple】— 苹果分流
server-https https://doh.dns.apple.com/dns-query -group apple

# 【Google】
server-https https://dns.google/dns-query -group google -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【MS】
server-https https://dns.quad9.net/dns-query -group microsoft -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【AI & Cloudflare】
server-https https://cloudflare-dns.com/dns-query -group ai_cf -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【Social Media】
server-https https://dns.adguard-dns.com/dns-query -group social -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【Global INTL】— 安全默认上游
server-https https://dns.google/dns-query -group proxy_intl -exclude-default-group -proxy socks5://127.0.0.1:6153
server-https https://cloudflare-dns.com/dns-query -group proxy_intl -exclude-default-group -proxy socks5://127.0.0.1:6153
server-https https://dns.quad9.net/dns-query -group proxy_intl -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【NSFW】— 隐私路由
server-https https://wikimedia-dns.org/dns-query -group nsfw -exclude-default-group -proxy socks5://127.0.0.1:6153

# 【TWNIC】
server-https https://dns.twnic.tw/dns-query -group tw -exclude-default-group -proxy socks5://127.0.0.1:6153

# ── Domain Sets ───────────────────────────────────────────────────────
domain-set -name cn_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn.txt
domain-set -name apple_list     -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/apple.txt
domain-set -name google_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/google.txt
domain-set -name ms_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/microsoft.txt
domain-set -name ai_cf_list     -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/ai_cf.txt
domain-set -name social_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/social.txt
domain-set -name tw_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/tw.txt
domain-set -name nsfw_list      -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/nsfw.txt
domain-set -name bootstrap_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/bootstrap.txt

# ── IP Sets ───────────────────────────────────────────────────────────
# 加载中国大陆 IP 库，用于智能回路
ip-set -name cn_ip -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn_ip.txt

# ── Routing Rules ─────────────────────────────────────────────────────

# 1. 精准解析：已知领域锁定到对应组
domain-rules /domain-set:bootstrap_list/ -nameserver cn
domain-rules /domain-set:apple_list/     -nameserver apple
domain-rules /domain-set:google_list/    -nameserver google
domain-rules /domain-set:ms_list/        -nameserver microsoft
domain-rules /domain-set:ai_cf_list/     -nameserver ai_cf
domain-rules /domain-set:social_list/    -nameserver social
domain-rules /domain-set:tw_list/        -nameserver tw
domain-rules /domain-set:nsfw_list/      -nameserver nsfw
domain-rules /domain-set:cn_list/        -nameserver cn

# 2. 安全默认：未知解析仅发往境外安全 DNS，杜绝交叉污染
domain-rules /./ -nameserver proxy_intl

# 3. 智能落地：如果安全 DNS 返回的是大陆 IP，则重定向到国内 DNS 优化 CDN
ip-rules /ip-set:cn_ip/ -nameserver cn
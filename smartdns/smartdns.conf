# smartdns-rs Configuration — V45 Safer Dual-Stack Edition
# ══════════════════════════════════════════════════════════════════════

log-level info
log-file /tmp/smartdns.log

# Audit is disabled by default to reduce local I/O noise and avoid
# amplifying client burst traffic. Enable it temporarily when debugging.
audit-enable no
audit-log /tmp/smartdns_audit.log
audit-size 1M

cache-size 65535
prefetch-domain yes
serve-expired yes
dualstack-ip-selection yes

# Keep smartdns passive: no active RTT probing and no forced HTTPS/SVCB
# suppression, otherwise system apps such as Mail can become slower or odd.
speed-check-mode none

# ── Listen (UDP + TCP, IPv4 + IPv6 loopback) ──
bind 127.0.0.1:6053
bind [::1]:6053
bind-tcp 127.0.0.1:6053
bind-tcp [::1]:6053

# Speed up switching between modes by reducing idle and wait times
tcp-idle-time 60
speed-check-mode none
max-reply-ip-num 1


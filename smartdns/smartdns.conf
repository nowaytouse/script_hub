# smartdns-rs Configuration — Monster Matrix & MosDNS 1:1 Restoration
# ══════════════════════════════════════════════════════════════════════

# ── General ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400

# ── Performance ───────────────────────────────────────────────────────
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15
response-mode first-ping
speed-check-mode ping,tcp:443,tcp:80

# ── Listen ────────────────────────────────────────────────────────────
bind     127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind     [::1]:6053
bind-tcp [::1]:6053

# ── Bootstrap (Monster Cluster) ───────────────────────────────────────
# 补全全量自举节点，确保冷启动解析瞬发
server 223.5.5.5               -bootstrap-dns
server 119.29.29.29            -bootstrap-dns
server 114.114.114.114         -bootstrap-dns
server 8.8.8.8                 -bootstrap-dns
server 1.1.1.1                 -bootstrap-dns
server [2400:3200::1]          -bootstrap-dns
server [2001:4860:4860::8888]  -bootstrap-dns

# ── Upstream Nameservers (Brute-Force Stacking) ───────────────────────

# 【CN General】— 国内大集群
server-https https://223.5.5.5/dns-query -group cn_cluster
server-https https://[2400:3200::1]/dns-query -group cn_cluster
server-https https://1.12.12.12/dns-query -group cn_cluster
server-https https://[2402:4e00::]/dns-query -group cn_cluster
server 223.6.6.6               -group cn_cluster
server 119.29.29.29            -group cn_cluster
server 114.114.114.114         -group cn_cluster

# 【Ali Specific】

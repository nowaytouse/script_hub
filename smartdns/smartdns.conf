# ── Bootstrap (Dual-Stack + Proxy-Friendly DoH) ──
# Use UDP for speed, but provide TCP/DoH fallback for Global Mode stability.
bootstrap-dns udp://223.5.5.5
bootstrap-dns udp://119.29.29.29
bootstrap-dns tcp://223.5.5.5
bootstrap-dns https://223.5.5.5/dns-query
bootstrap-dns https://1.12.12.12/dns-query

# ── Upstream: Group [cn] (Direct CN Path) ──
server-https https://dns.alidns.com/dns-query -group cn
server-https https://1.12.12.12/dns-query -group cn
server-https https://120.53.53.53/dns-query -group cn
server tcp://223.5.5.5 -group cn
server tcp://119.29.29.29 -group cn
server 223.5.5.5 -group cn
server 119.29.29.29 -group cn
server 2400:3200::1 -group cn
server 2402:4e00:: -group cn

# Bootstrap-sensitive domains stay on direct UDP to avoid any SOCKS/DoH loop.
server 223.5.5.5 -group bootstrap
server 119.29.29.29 -group bootstrap
server 2400:3200::1 -group bootstrap
server 2402:4e00:: -group bootstrap

# ── Upstream: Direct Specialty ──
server-https https://doh.dns.apple.com/dns-query -group apple

# ── Upstreams: DoH over SOCKS5 (with per-bucket redundancy) ──
server-https https://8.8.8.8/dns-query -group google -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group google -proxy socks5://127.0.0.1:6153


# smartdns-rs Configuration — Fastest-IP layer beneath mosdns
# Version: 2026.04.18a
# Role: Speed-tested racing for CN + Intl buckets, TTL smoothing, IPv6 preference, audit.
# Chained from mosdns (127.0.0.1:53 / [::1]:53) → this (6353 CN, 6354 Intl).
# FIX: corrected chain comment (:5335 → :53), added bind-tcp, fixed NextDNS config ID placeholder.

log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4

# Audit log — captures every query that reaches SmartDNS plus the selected IP
audit-enable yes
audit-file /tmp/smartdns_audit.log
audit-size 16M
audit-num 8

# Cache + TTL smoothing
cache-size 32768
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 259200
serve-expired-prefetch-time 21600
rr-ttl-min 60
rr-ttl-max 86400

# IPv6 preference — return AAAA unless v4 is >15ms faster
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

# Return the first IP that wins the ping test (balances latency and throughput)
response-mode first-ping

# SOCKS5 to Surge — matches mosdns/config.yaml
proxy-server socks5://127.0.0.1:6153 -name surge

# Global speed-check default. Neutralised on the intl bind via -no-speed-check
# because speed-testing proxied IPs from the direct network is misleading.
speed-check-mode ping,tcp:443

# ─────────────────────────────────────────────
# Listen groups — mosdns forwards into these
# UDP + TCP both declared for completeness.
# ─────────────────────────────────────────────
bind     127.0.0.1:6353 -group cn -no-speed-check
bind-tcp 127.0.0.1:6353 -group cn -no-speed-check
bind     [::1]:6353     -group cn -no-speed-check
bind-tcp [::1]:6353     -group cn -no-speed-check

bind     127.0.0.1:6354 -group intl -no-speed-check
bind-tcp 127.0.0.1:6354 -group intl -no-speed-check
bind     [::1]:6354     -group intl -no-speed-check
bind-tcp [::1]:6354     -group intl -no-speed-check

# ─────────────────────────────────────────────
# CN upstreams — direct network, speed-check valid
# doh.pub and dns.pub are both DNSPod (Tencent) endpoints;
# kept for upstream diversity / failover.
# ─────────────────────────────────────────────
server-https https://dns.alidns.com/dns-query -group cn -exclude-default-group
server-https https://doh.pub/dns-query         -group cn -exclude-default-group
server-https https://dns.pub/dns-query         -group cn -exclude-default-group
server-https https://doh.360.cn/dns-query      -group cn -exclude-default-group

# ─────────────────────────────────────────────
# Intl upstreams — all via Surge SOCKS5
# NOTE: Replace <YOUR_NEXTDNS_CONFIG_ID> with your actual NextDNS config ID.
#       Without it, queries go to NextDNS anonymous mode (no your-config filtering).
#       Find it at: https://my.nextdns.io → your config → "Setup" tab.
# ─────────────────────────────────────────────
server-https https://8.8.8.8/dns-query                             -group intl -exclude-default-group -proxy surge
server-https https://1.1.1.1/dns-query                             -group intl -exclude-default-group -proxy surge
server-https https://9.9.9.9/dns-query                             -group intl -exclude-default-group -proxy surge
server-https https://94.140.14.14/dns-query                         -group intl -exclude-default-group -proxy surge
server-https https://dns.nextdns.io/<YOUR_NEXTDNS_CONFIG_ID>/dns-query -group intl -exclude-default-group -proxy surge
server-https https://208.67.222.222/dns-query                       -group intl -exclude-default-group -proxy surge
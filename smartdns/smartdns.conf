# Default proxy pool for unmatched international domains.
# - DoH via SOCKS is preferred for Privacy/Rule mode.
# - UDP/TCP via domestic IPs is added as Failover for Direct mode.
server-https https://8.8.8.8/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://9.9.9.9/dns-query -group proxy -proxy socks5://127.0.0.1:6153


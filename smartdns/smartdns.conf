# smartdns-rs Configuration — CN-only acceleration bucket under mosdns
# Version: 2026.04.19-r2
#
# ══════════════════════════════════════════════════════════════════════
# 职责：仅处理 mosdns 转发来的 CN 桶请求。
#       所有路由决策由 mosdns 在上游完成，SmartDNS 无需感知。
#
# 修复：
#   1. 添加 bootstrap-dns — 解决启动时 DoH 域名无法解析的问题
#      （原配置没有 bootstrap，SmartDNS 可能在 mosdns 未就绪时
#       意外把解析请求转给系统 DNS → Surge，形成启动期循环）
#   2. 删除 airport 上游组及 domain-rules — 这些是死代码
#      mosdns airport_sequence 在上游已拦截，流量根本到不了这里；
#      但 SmartDNS 启动时仍会对这些上游做健康检查，直连 CF/Google
#      在国内网络会超时，拖慢或卡住整个服务启动
#   3. 移除 360 DNS — 可靠性差，隐私问题
#   4. serve-expired-ttl 从 86400 降为 43200
#      mosdns 层已有 lazy_cache_ttl 86400，两层叠加会导致
#      陈旧记录最长存活 ~2 天
#
# 重要约束：SmartDNS 的任何上游 **不得** 经过 Surge / mihomo。
#   若 SmartDNS → Surge → mosdns → SmartDNS，同样死循环。
# ══════════════════════════════════════════════════════════════════════

# ── 日志 ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4

# 关闭 audit — 高频 DNS 查询会迅速写满磁盘
audit-enable no

# ── 缓存 ───────────────────────────────────────────────────────────
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache

# prefetch 关闭 — mosdns 已有 lazy_cache，重复预取浪费 CPU
prefetch-domain no

# 过期服务：降为 43200（12h）
# mosdns lazy_cache_ttl=86400 是第二层保障，两层加起来已足够
serve-expired yes
serve-expired-ttl 43200
rr-ttl-min 60
rr-ttl-max 86400

# ── 双栈选择 ────────────────────────────────────────────────────────
# AAAA 优先，除非 A 在延迟上快超过 15ms
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

# ── 测速模式（仅对 CN 上游生效）────────────────────────────────────
response-mode first-ping
speed-check-mode ping,tcp:443

# ── Bootstrap DNS ───────────────────────────────────────────────────
# 纯 UDP，仅用于 SmartDNS 启动时解析 DoH 上游的主机名
#（如 dns.alidns.com → 223.5.5.5）。
# 这些请求 **不经过 Surge**，直连 CN 公共 DNS。
# 没有 bootstrap 时，SmartDNS 可能在 mosdns 还未就绪的情况下
# 把解析请求转给系统 DNS，触发代理链循环。
server 223.5.5.5        -bootstrap-dns
server 223.6.6.6        -bootstrap-dns
server 119.29.29.29     -bootstrap-dns
server [2400:3200::1]:53  -bootstrap-dns
server [2402:4e00::]:53   -bootstrap-dns

# ── 监听地址 ────────────────────────────────────────────────────────
# 绑定 6053 端口与 Surge 互联
bind     127.0.0.1:6053 -group cn
bind-tcp 127.0.0.1:6053 -group cn
bind     [::1]:6053     -group cn
bind-tcp [::1]:6053     -group cn

# ── CN 上游 ─────────────────────────────────────────────────────────
# 直连国内网络，不走任何代理。
# SmartDNS 会并发查询全部上游，取 first-ping 最快结果。
#
# AliDNS（阿里云）— 最快，覆盖全国 CDN 节点
server-https https://dns.alidns.com/dns-query -group cn -exclude-default-group

# DNSPod / doh.pub（腾讯）— 保留两个端点做冗余
# dns.pub 与 doh.pub 是同一服务的不同域名，提供 failover
server-https https://doh.pub/dns-query -group cn -exclude-default-group
server-https https://dns.pub/dns-query -group cn -exclude-default-group

# ── 已移除 ──────────────────────────────────────────────────────────
# [移除] doh.360.cn — 360 DNS 可靠性差，存在 DNS 污染和隐私风险
#
# [移除] airport 上游组（cloudflare / google / quad9 直连无代理）
#   原因：mosdns airport_sequence 在上游已拦截 airport 域名，
#   流量不会到达 SmartDNS。但 SmartDNS 启动时仍会对这些上游
#   做健康检查 → 直连 CF/Google 超时 → 拖慢服务启动。
#
# [移除] domain-rules /liangxin.xyz/ 和 /liangxin1.xyz/
#   原因：同上，这些域名在 mosdns matcher_airport 层已被拦截，
#   domain-rules 永远不会被触发，保留只会引起混淆。
#   如需确保覆盖，请在 mosdns 的 steer_Airport.txt 中维护。
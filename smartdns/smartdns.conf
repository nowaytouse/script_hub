# ── Anti-Poisoning (Basic GFW Filter) ──
# Filters common dummy IPs returned by domestic servers for international domains.
bogus-nxdomain 0.0.0.0/8
bogus-nxdomain 127.0.0.0/8
bogus-nxdomain ::/128
bogus-nxdomain ::1/128

# Fallback: anything still unmatched goes to the proxy-resolver pool.
domain-rules /./ -nameserver proxy

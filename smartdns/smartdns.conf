# smartdns-rs Configuration — Stable CN acceleration beneath mosdns
# Version: 2026.04.19
# Role: only handle the CN bucket locally and leave intl DoH to mosdns directly.
# This removes the Surge -> mosdns -> smartdns -> Surge SOCKS5 self-dependency.

log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4

# Disable audit under Surge; the per-query log can easily flood the app with local DNS traffic.
audit-enable no
audit-file /tmp/smartdns_audit.log
audit-size 16M
audit-num 8

# Cache + conservative TTL smoothing
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain no
serve-expired yes
serve-expired-ttl 86400
rr-ttl-min 60
rr-ttl-max 86400

# IPv6 preference — return AAAA unless v4 is >15ms faster
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

# Return the first IP that wins the ping test for CN answers only.
response-mode first-ping

# Global speed-check default for CN endpoints only.
speed-check-mode ping,tcp:443

# ─────────────────────────────────────────────
# Listen group — mosdns forwards CN traffic into this bucket.
# ─────────────────────────────────────────────
bind     127.0.0.1:6353 -group cn
bind-tcp 127.0.0.1:6353 -group cn
bind     [::1]:6353     -group cn
bind-tcp [::1]:6353     -group cn

# ─────────────────────────────────────────────
# CN upstreams — direct network, speed-check valid
# doh.pub and dns.pub are both DNSPod (Tencent) endpoints;
# kept for upstream diversity / failover.
# ─────────────────────────────────────────────
server-https https://dns.alidns.com/dns-query -group cn -exclude-default-group
server-https https://doh.pub/dns-query         -group cn -exclude-default-group
server-https https://dns.pub/dns-query         -group cn -exclude-default-group
server-https https://doh.360.cn/dns-query      -group cn -exclude-default-group

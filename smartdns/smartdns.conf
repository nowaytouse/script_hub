# smartdns-rs Configuration — Full Fine-Grained & Secured Build
# ══════════════════════════════════════════════════════════════════════

# ── General ───────────────────────────────────────────────────────────
log-level info
log-file /tmp/smartdns.log
log-size 8M
log-num 4
cache-size 16384
cache-persist yes
cache-file /tmp/smartdns.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
rr-ttl-min 60
rr-ttl-max 86400

# ── Performance ───────────────────────────────────────────────────────
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15
response-mode first-ping
speed-check-mode ping,tcp:443,tcp:80

# ── Listen ────────────────────────────────────────────────────────────
bind     127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind     [::1]:6053
bind-tcp [::1]:6053

# ── Bootstrap (UDP Only) ──────────────────────────────────────────────
server 223.5.5.5             -bootstrap-dns
server 119.29.29.29          -bootstrap-dns
server 114.114.114.114       -bootstrap-dns
server 8.8.8.8               -bootstrap-dns
server 1.1.1.1               -bootstrap-dns

# ── Upstream Groups ───────────────────────────────────────────────────

# 【CN】— 境内加速 (UDP/DoH 混合)
server-https https://dns.alidns.com/dns-query -group cn
server-https https://doh.pub/dns-query -group cn
server 223.5.5.5  -group cn
server 119.29.29.29 -group cn

# 【Apple】— 苹果分流 (DoH 直连)
server-https https://doh.dns.apple.com/dns-query -group apple

# 【Google】
server-https https://dns.google/dns-query -group google -proxy socks5://127.0.0.1:6153
server-https https://[2001:4860:4860::8888]/dns-query -group google -proxy socks5://127.0.0.1:6153

# 【MS】
server-https https://dns.quad9.net/dns-query -group microsoft -proxy socks5://127.0.0.1:6153

# 【AI & Cloudflare】
server-https https://cloudflare-dns.com/dns-query -group ai_cf -proxy socks5://127.0.0.1:6153
server-https https://[2606:4700:4700::1111]/dns-query -group ai_cf -proxy socks5://127.0.0.1:6153

# 【Social】
server-https https://dns.adguard-dns.com/dns-query -group social -proxy socks5://127.0.0.1:6153

# 【TikTok】
server-https https://1.1.1.1/dns-query -group tiktok -proxy socks5://127.0.0.1:6153

# 【GitHub】
server-https https://dns.google/dns-query -group github -proxy socks5://127.0.0.1:6153

# 【JP】
server-https https://dns.google/dns-query -group jp -proxy socks5://127.0.0.1:6153

# 【TW】
server-https https://dns.twnic.tw/dns-query -group tw -proxy socks5://127.0.0.1:6153

# 【NSFW】— 隐私路由 (Wikimedia DNS)
server-https https://wikimedia-dns.org/dns-query -group nsfw -proxy socks5://127.0.0.1:6153

# 【Global INTL】— 默认境外兜底
server-https https://dns.google/dns-query -group proxy_intl -proxy socks5://127.0.0.1:6153
server-https https://cloudflare-dns.com/dns-query -group proxy_intl -proxy socks5://127.0.0.1:6153

# ── Domain Sets (14 Full Sets) ───────────────────────────────────────
domain-set -name cn_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn.txt
domain-set -name apple_list     -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/apple.txt
domain-set -name google_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/google.txt
domain-set -name ms_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/microsoft.txt
domain-set -name ai_cf_list     -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/ai_cf.txt
domain-set -name social_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/social.txt
domain-set -name tiktok_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/tiktok.txt
domain-set -name github_list    -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/github.txt
domain-set -name tw_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/tw.txt
domain-set -name jp_list        -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/jp.txt
domain-set -name nsfw_list      -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/nsfw.txt
domain-set -name bootstrap_list -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/bootstrap.txt
domain-set -name airport_list   -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/airport.txt

# ── IP Sets ───────────────────────────────────────────────────────────
ip-set -name cn_ip -file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/cn_ip.txt

# ── Routing Rules ─────────────────────────────────────────────────────

# 1. 强制直连 (自举域名与代理服务器名)
domain-rules /domain-set:bootstrap_list/ -nameserver cn

# 2. 国内加速
domain-rules /domain-set:cn_list/        -nameserver cn

# 3. 专项分流 (Apple & International)
domain-rules /domain-set:apple_list/     -nameserver apple
domain-rules /domain-set:google_list/    -nameserver google
domain-rules /domain-set:ms_list/        -nameserver microsoft
domain-rules /domain-set:ai_cf_list/     -nameserver ai_cf
domain-rules /domain-set:social_list/    -nameserver social
domain-rules /domain-set:tiktok_list/    -nameserver tiktok
domain-rules /domain-set:github_list/    -nameserver github
domain-rules /domain-set:tw_list/        -nameserver tw
domain-rules /domain-set:jp_list/        -nameserver jp
domain-rules /domain-set:nsfw_list/      -nameserver nsfw
domain-rules /domain-set:airport_list/   -nameserver google

# 4. 安全默认逻辑
# 未知域名优先走 Google/CF 的安全组 (确保非 cn 域名首选加密解析)
domain-rules /./ -nameserver google -nameserver ai_cf -nameserver proxy_intl

# 5. IP 智能回路 (Security Guard)
# 如果上述解析结果返回的是大陆 IP，则重定向到国内 DNS 重新解析以获取 CDN 最优节点
ip-rules /ip-set:cn_ip/ -nameserver cn
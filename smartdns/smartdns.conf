# smartdns-rs Configuration — V44.6 Unified Final Edition
# ══════════════════════════════════════════════════════════════════════

log-level info
log-file /tmp/smartdns.log
audit-enable yes
audit-log /tmp/smartdns_audit.log
audit-size 1M

cache-size 65535
prefetch-domain yes
serve-expired yes
dual-stack-ip-selection yes

# ── Surge Compatibility: Zero Latency ──
# 此时我们的 TCP 通道已打通，测速已无必要
speed-check-mode none
force-qtype-soa 65

# ── Listen ──
bind 127.0.0.1:6053

# ── Static Mappings ──
address /dns.alidns.com/223.5.5.5
address /dns.alidns.com/223.6.6.6
address /doh.pub/1.12.12.12
address /doh.pub/120.53.53.53
address /dot.pub/1.12.12.12
address /dot.pub/120.53.53.53
address /wikimedia-dns.org/103.102.166.224

# ── Bootstrap ──
bootstrap-dns udp://223.5.5.5
bootstrap-dns udp://119.29.29.29

# ── Upstream Groups ──
server-https https://dns.alidns.com/dns-query -group cn
server-https https://1.12.12.12/dns-query -group cn
server-https https://120.53.53.53/dns-query -group cn
server-tls dns.alidns.com -group cn
server-tls 1.12.12.12 -group cn
server-tls 120.53.53.53 -group cn
server 223.5.5.5 -group cn
server 119.29.29.29 -group cn

server-https https://wikimedia-dns.org/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://dns.google/dns-query -group proxy -proxy socks5://127.0.0.1:6153
server-https https://1.1.1.1/dns-query -group proxy -proxy socks5://127.0.0.1:6153

# ── Final Routing Strategy ──
domain-set -name cn_list -file /tmp/cn.txt

# 国内列表走国内
domain-rules /domain-set:cn_list/ -nameserver cn

# 特殊锁定 (百度全族保护)
domain-rules /baidu.com/ -nameserver cn
domain-rules /shifen.com/ -nameserver cn

# 默认走代理 (恢复分流能力)
domain-rules /./ -nameserver proxy -nameserver cn

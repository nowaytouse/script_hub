[package]
name = "rust_processor"
version = "0.1.0"
edition = "2024"
description = "Rust core and native desktop workspace for Script Hub rules and modules"
license = "GPL-3.0-only"
repository = "https://github.com/nowaytouse/script_hub"
readme = "README.md"
publish = false

[[bin]]
name = "script-hub-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe"]

# 構建輸出統一至項目根目錄 target/
# PROMAX 的本地处理、网络下载和产物验证均由 Rust 负责。
[profile.release]
strip = true
lto = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.13"
fancy-regex = "0.20.0"
once_cell = "1.21"
walkdir = "2.5.0"
percent-encoding = "2.3"
chrono = "0.4"
md5 = "0.8"
ureq = { version = "3.5.0", features = ["socks-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sys-locale = "0.3.2"
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts"] }

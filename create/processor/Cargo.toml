[package]
name = "rust_processor"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_processor"
crate-type = ["staticlib"]

# 構建輸出統一至項目根目錄 target/
# Rust 只負責本地處理，Go 只負責網絡操作
[profile.release]
strip = true
lto = true

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"
walkdir = "2.5.0"
percent-encoding = "2.3"
chrono = "0.4"
md5 = "0.7"
ureq = "3.4.0"

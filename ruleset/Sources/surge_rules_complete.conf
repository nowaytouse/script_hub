# =============================================================================
# Surge 完整规则配置 - 基于 script_hub 规则集
# 更新日期: 2025-12-07
# 规则集数量: 46 (consolidated from 58, optimized order)
# 
# DNS防泄漏规则顺序说明:
#   1. 广告拦截 (REJECT) - 最高优先级
#   2. 特殊路由 - 用户自定义
#   3. 进程规则 - 应用级别
#   4. 国内服务 - 中国域名直连 (防止DNS泄漏)
#   5. 海外服务 - 代理规则
#   6. ChinaDirect - 中国域名兜底 (防止DNS泄漏)
#   7. GlobalProxy - 海外域名兜底
#   8. GEOIP - IP级别兜底
#   9. FINAL - 最终兜底
# =============================================================================

[Rule]
# ============ 去广告规则 (优先级最高) ============
RULE-SET,https://raw.githubusercontent.com/nowaytouse/script_hub/master/ruleset/Surge(Shadowkroket)/AdBlock.list,REJECT,pre-matching,extended-matching,update-interval=86400,no-resolve

# ============ 特殊路由 ============
DOMAIN-KEYWORD,reddit,🌐 社交媒体 📱
DOMAIN,pass-api.proton.me,"🇰🇷 韩国 🇰🇷"
DOMAIN,list.linehk.top,"🇭🇰 香港 🇭🇰",extended-matching
DOMAIN,nyamiiko.sgddns,"🛜 PonTen 🏠"


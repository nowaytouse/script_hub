conf-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/compat/github_rules.conf
conf-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/compat/social_rules.conf
conf-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/compat/tiktok_rules.conf
conf-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/compat/nsfw_rules.conf
conf-file /Users/nyamiiko/Downloads/GitHub/script_hub/smartdns/rules/compat/tw_rules.conf

# smartdns-rs Configuration — V45.2 Expert Flattened Edition
# ══════════════════════════════════════════════════════════════════════

log-level info
log-file /tmp/smartdns.log

# Audit is disabled by default to reduce local I/O noise.
audit-enable no
audit-log /tmp/smartdns_audit.log
audit-size 1M

cache-size 65535
prefetch-domain yes
serve-expired yes
dualstack-ip-selection no

# Keep smartdns passive: no active RTT probing.
speed-check-mode none

# ── Listen (UDP + TCP, IPv4 loopback) ──
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053

# Speed up switching between modes by reducing idle and wait times
tcp-idle-time 60
max-reply-ip-num 1

# ── Static Mappings (Bootstrap / Anti-Recursion) ──
address /dns.alidns.com/223.5.5.5
address /dns.alidns.com/223.6.6.6
address /doh.pub/1.12.12.12
address /doh.pub/120.53.53.53
address /dns.pub/1.12.12.12
address /dns.pub/120.53.53.53
address /doh.dns.apple.com/17.253.144.10
address /dns.google/8.8.8.8
address /dns.google/8.8.4.4
address /dns.google.com/8.8.8.8
address /cloudflare-dns.com/104.16.249.249
address /wikimedia-dns.org/185.71.138.138

# ── Bootstrap (Pure UDP) ──
bootstrap-dns udp://223.5.5.5
bootstrap-dns udp://119.29.29.29

# ── Upstream: Group [cn] (Direct CN Path) ──
server 223.5.5.5 -group cn
server 119.29.29.29 -group cn
server tcp://223.5.5.5 -group cn
server tcp://119.29.29.29 -group cn

# ── Upstream: Group [bootstrap] ──
server 223.5.5.5 -group bootstrap
server 119.29.29.29 -group bootstrap

# ── Upstream: Direct Specialty ──
server-https https://doh.dns.apple.com/dns-query -group apple

# ── Upstreams: International (Direct via Surge Proxy) ──
server-https https://8.8.8.8/dns-query -group google 
server-https https://1.1.1.1/dns-query -group google 
server-https https://wikimedia-dns.org/dns-query -group github 
server-https https://doh.libredns.gr/dns-query -group github 
server-https https://wikimedia-dns.org/dns-query -group microsoft 
server-https https://1.1.1.1/dns-query -group microsoft 
server-https https://1.1.1.1/dns-query -group ai_cf 
server-https https://8.8.8.8/dns-query -group ai_cf 
server-https https://dns.twnic.tw/dns-query -group tw 
server-https https://1.1.1.1/dns-query -group tw 
server-https https://dns.adguard-dns.com/dns-query -group social 
server-https https://1.1.1.1/dns-query -group social 
server-https https://wikimedia-dns.org/dns-query -group nsfw 
server-https https://doh.libredns.gr/dns-query -group nsfw 
server-https https://8.8.8.8/dns-query -group tiktok 
server-https https://1.1.1.1/dns-query -group tiktok 
server-https https://8.8.8.8/dns-query -group airport 
server-https https://1.1.1.1/dns-query -group airport 

# Default proxy pool for unmatched international domains.
server-https https://8.8.8.8/dns-query -group proxy 
server-https https://1.1.1.1/dns-query -group proxy 
server-https https://wikimedia-dns.org/dns-query -group proxy 
server-https https://doh.libredns.gr/dns-query -group proxy 


# mosdns Configuration - Stable dual-stack steering for Surge / mihomo
# Version: 2026.04.19-r2
#
# ══════════════════════════════════════════════════════════════════════
# 根本修复：所有经 SOCKS5 的上游均加 dial_addr（硬编码 IP）。
#
# 问题根因：mosdns 通过 Surge SOCKS5(:6153) 连接 dns.google 时，
#   Surge 需要先 DNS 解析 "dns.google"，于是向 mosdns 查询，
#   mosdns 又要用 SOCKS5 → 死循环 → Surge 崩溃 / mihomo 报错。
#
# dial_addr 让 mosdns 直接告诉 SOCKS5 "连 8.8.8.8:443"，
#   完全跳过 DNS 解析环节，循环消失。
#
# 其他改进：
#   - GitHub 从 google 组独立（Fastly CDN，走 intl_general 更稳）
#   - 每个单上游 forwarder 补全冗余副本
#   - CN 直连 forwarder (Apple/Ali/Tencent) 加 dial_addr 防异常解析
# ══════════════════════════════════════════════════════════════════════

log:
  level: info
  file: "/tmp/mosdns.log"
  production: true

plugins:

  # ────────────────────────────────────────────────────────────────────
  # Cache
  # ────────────────────────────────────────────────────────────────────
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # ────────────────────────────────────────────────────────────────────
  # Domain Matchers
  # ────────────────────────────────────────────────────────────────────
  - tag: matcher_apple
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_Apple.txt"]}

  - tag: matcher_google
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_Google.txt"]}

  # GitHub 独立 — Fastly CDN，与 Google 无关，走 intl_general 多上游更稳
  - tag: matcher_github
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_GitHub.txt"]}

  - tag: matcher_microsoft
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_Microsoft.txt"]}

  - tag: matcher_ai_cf
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_AI.txt", "__MOSDNS_DATA__/steer_Cloudflare.txt"]}

  - tag: matcher_nsfw
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/nsfw_domain.txt"]}

  - tag: matcher_tw
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_StreamTW.txt"]}

  - tag: matcher_social
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_SocialMedia.txt"]}

  - tag: matcher_tiktok
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_TikTok.txt"]}

  - tag: matcher_ali
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/vendor_ali.txt"]}

  - tag: matcher_tencent
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/vendor_tencent.txt"]}

  - tag: matcher_bootstrap
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_Bootstrap.txt"]}

  - tag: matcher_airport
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/steer_Airport.txt"]}

  - tag: cn_domain_matcher
    type: domain_set
    args: {files: ["__MOSDNS_DATA__/cn_domain.txt"]}

  # ────────────────────────────────────────────────────────────────────
  # IP Matcher (CN，仅用于 intl_sequence 回退判断)
  # ────────────────────────────────────────────────────────────────────
  - tag: cn_ip_matcher
    type: ip_set
    args:
      files:
        - "__MOSDNS_DATA__/cn_ip.txt"
        - "__MOSDNS_DATA__/cn_ip_v6.txt"

  # ────────────────────────────────────────────────────────────────────
  # Forwarders
  #
  # 规则：
  #   ① 走 SOCKS5 的上游 → 必须加 dial_addr（硬编码 IP），防止 Surge 触发 DNS 解析循环
  #   ② 直连上游（不走代理）→ 加 dial_addr 也无害，可防止本机 DNS 异常时失败
  #   ③ 本地端口（SmartDNS / Bootstrap UDP）→ 无需 dial_addr
  # ────────────────────────────────────────────────────────────────────

  # Apple DoH — 直连，Apple 自家 Anycast，无需代理
  - tag: forward_apple
    type: forward
    args:
      upstreams:
        - addr: "https://doh.dns.apple.com/dns-query"
          dial_addr: "17.253.144.10:443"
          enable_pipeline: true
        - addr: "https://doh.dns.apple.com/dns-query"
          dial_addr: "17.253.144.11:443"
          enable_pipeline: true

  # Google DoH — 经 SOCKS5，dial_addr 防解析循环
  - tag: forward_google
    type: forward
    args:
      upstreams:
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.4.4:443"
          socks5: "127.0.0.1:6153"

  # Quad9 — 经 SOCKS5
  - tag: forward_quad9
    type: forward
    args:
      upstreams:
        - addr: "https://dns.quad9.net/dns-query"
          dial_addr: "9.9.9.9:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.quad9.net/dns-query"
          dial_addr: "149.112.112.112:443"
          socks5: "127.0.0.1:6153"

  # Cloudflare DoH — 经 SOCKS5
  - tag: forward_cloudflare
    type: forward
    args:
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.0.0.1:443"
          socks5: "127.0.0.1:6153"

  # Wikimedia Privacy DNS — 经 SOCKS5（NSFW 隐私路由用）
  - tag: forward_wikimedia_privacy
    type: forward
    args:
      upstreams:
        - addr: "https://wikimedia-dns.org/dns-query"
          dial_addr: "185.71.138.138:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://wikimedia-dns.org/dns-query"
          dial_addr: "185.71.138.139:443"
          socks5: "127.0.0.1:6153"

  # TWNIC — 经 SOCKS5（台湾串流用）
  - tag: forward_twnic
    type: forward
    args:
      upstreams:
        - addr: "https://dns.twnic.tw/dns-query"
          dial_addr: "101.101.101.101:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.twnic.tw/dns-query"
          dial_addr: "101.102.103.104:443"
          socks5: "127.0.0.1:6153"

  # AdGuard — 经 SOCKS5（Social Media 用）
  - tag: forward_adguard_social
    type: forward
    args:
      upstreams:
        - addr: "https://dns.adguard-dns.com/dns-query"
          dial_addr: "94.140.14.14:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.adguard-dns.com/dns-query"
          dial_addr: "94.140.15.15:443"
          socks5: "127.0.0.1:6153"

  # AliDNS — 直连，国内 pipeline
  - tag: forward_ali
    type: forward
    args:
      upstreams:
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.5.5.5:443"
          enable_pipeline: true
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.6.6.6:443"
          enable_pipeline: true

  # DNSPod (Tencent) — 直连，国内 pipeline
  - tag: forward_tencent
    type: forward
    args:
      upstreams:
        - addr: "https://doh.pub/dns-query"
          dial_addr: "1.12.12.12:443"
          enable_pipeline: true
        - addr: "https://doh.pub/dns-query"
          dial_addr: "120.53.53.53:443"
          enable_pipeline: true

  # SmartDNS CN 桶 — 本地 UDP+TCP，不走任何代理
  # 重要：SmartDNS 自身的上游也不能走 Surge，否则同样会形成循环
  - tag: forward_smartdns_cn
    type: forward
    args:
      upstreams:
        - addr: "udp://127.0.0.1:6353"
        - addr: "tcp://127.0.0.1:6353"

  # Bootstrap — 纯 UDP，不走 DoH / 不走代理
  # 用途：mosdns 启动初期 DoH 域名自举解析（如 dns.google 本身）
  - tag: forward_bootstrap
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "223.5.5.5"
        - addr: "[2400:3200::1]:53"
        - addr: "119.29.29.29"
        - addr: "[2402:4e00::]:53"
        - addr: "1.1.1.1"
        - addr: "[2620:fe::fe]:53"

  # 通用国际 DoH — concurrent 2-of-3，全部加 dial_addr
  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1:443"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.quad9.net/dns-query"
          dial_addr: "9.9.9.9:443"
          socks5: "127.0.0.1:6153"

  # ────────────────────────────────────────────────────────────────────
  # Sequences
  # ────────────────────────────────────────────────────────────────────

  # NSFW：隐私路由（注意：这里是换 DNS，不是屏蔽）
  - tag: nsfw_sequence
    type: sequence
    args:
      - exec: $forward_wikimedia_privacy
      - exec: accept

  # TikTok：国际多上游
  - tag: tiktok_sequence
    type: sequence
    args:
      - exec: $forward_intl_general
      - exec: accept

  # Airport：机场订阅/节点域名，必须走直接国际 DoH
  # SmartDNS 对 AWS/非标端口托管的域名常返回空答案，所以绕开
  - tag: airport_sequence
    type: sequence
    args:
      - exec: $forward_intl_general
      - exec: accept

  # CN sequence：直接信任 SmartDNS 结果，无需 IP 验证
  # CN resolver 对本地流量永远返回最优 CDN（含 Akamai/Fastly HK 节点），不验证
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_cn
      - exec: accept

  # Intl sequence：先国际 DoH，若返回 CN IP 则回退 SmartDNS
  # （国际域名落 CN CDN 的情况，如 Fastly/Akamai 国内节点）
  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_intl_general
      - matches: "!resp_ip $cn_ip_matcher"
        exec: accept
      # 国际域名返回了 CN IP → 转 CN 解析路径
      - exec: $forward_smartdns_cn
      - exec: accept

  # ────────────────────────────────────────────────────────────────────
  # Main Sequence（路由优先级从高到低）
  # ────────────────────────────────────────────────────────────────────
  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache

      # 1. Bootstrap 自举域名 — 纯 UDP，最高优先级
      - matches: qname $matcher_bootstrap
        exec: $forward_bootstrap
      - matches: qname $matcher_bootstrap
        exec: accept

      # 2. NSFW — 隐私 DNS 路由
      - matches: qname $matcher_nsfw
        exec: jump nsfw_sequence

      # 3. TikTok
      - matches: qname $matcher_tiktok
        exec: jump tiktok_sequence

      # 4. Airport 订阅 / 节点域名
      - matches: qname $matcher_airport
        exec: jump airport_sequence

      # 5. Apple — Apple 自家 DoH 直连
      - matches: qname $matcher_apple
        exec: $forward_apple
      - matches: qname $matcher_apple
        exec: accept

      # 6. Google
      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept

      # 7. GitHub — Fastly CDN，独立走 intl_general 多上游
      - matches: qname $matcher_github
        exec: jump intl_sequence

      # 8. Microsoft — Quad9（对微软服务有针对性优化）
      - matches: qname $matcher_microsoft
        exec: $forward_quad9
      - matches: qname $matcher_microsoft
        exec: accept

      # 9. AI / Cloudflare — Cloudflare DoH
      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept

      # 10. 台湾串流 — TWNIC
      - matches: qname $matcher_tw
        exec: $forward_twnic
      - matches: qname $matcher_tw
        exec: accept

      # 11. Social Media — AdGuard
      - matches: qname $matcher_social
        exec: $forward_adguard_social
      - matches: qname $matcher_social
        exec: accept

      # 12. 阿里系
      - matches: qname $matcher_ali
        exec: $forward_ali
      - matches: qname $matcher_ali
        exec: accept

      # 13. 腾讯系
      - matches: qname $matcher_tencent
        exec: $forward_tencent
      - matches: qname $matcher_tencent
        exec: accept

      # 14. 通用 CN 域名 → SmartDNS
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence

      # 15. 其余一律走国际路径（含 CN IP 回退检测）
      - exec: jump intl_sequence

  # ────────────────────────────────────────────────────────────────────
  # Servers
  # ────────────────────────────────────────────────────────────────────
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}

  - tag: udp_server_v6
    type: udp_server
    args: {entry: main_sequence, listen: "[::1]:53"}

  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}

  - tag: tcp_server_v6
    type: tcp_server
    args: {entry: main_sequence, listen: "[::1]:53"}

  - tag: doh_server
    type: http_server
    args:
      listen: "127.0.0.1:5336"
      entries:
        - path: /dns-query
          exec: main_sequence

  - tag: doh_server_v6
    type: http_server
    args:
      listen: "[::1]:5336"
      entries:
        - path: /dns-query
          exec: main_sequence
# mosdns Configuration - Dual-Track DNS (v5 Plugin-Based Compatibility Mode)
# Version: 2026.04.16m
# Optimized: Removed doh.360.cn to reduce TLS handshake warnings. 

log:
  level: info
  file: "/tmp/mosdns.log"

plugins:
  # 1. Cache
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # 2. Matchers
  - tag: cn_domain_matcher
    type: domain_set
    args:
      files:
        - ./cn_domain.txt

  - tag: cn_ip_matcher
    type: ip_set
    args:
      files:
        - ./cn_ip.txt

  # 3. Forwarders - Mainland Primary (DoH ONLY)
  - tag: forward_cn_primary
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: https://dns.alidns.com/dns-query
          enable_pipeline: true
        - addr: https://doh.pub/dns-query
          enable_pipeline: true

  # Mainland Secondary (DoH)
  - tag: forward_cn_secondary
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: https://dns.baidu.com/dns-query
          enable_pipeline: true
        - addr: https://dns.volcengine.com/dns-query
          enable_pipeline: true

  # International Primary (DoH via SOCKS5)
  - tag: forward_intl_primary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://cloudflare-dns.com/dns-query
          enable_pipeline: true
          socks5: 127.0.0.1:6153
        - addr: https://dns.google/dns-query
          enable_pipeline: true
          socks5: 127.0.0.1:6153
        - addr: https://dns.quad9.net/dns-query
          enable_pipeline: true
          socks5: 127.0.0.1:6153

  # International Secondary (DoH via SOCKS5)
  - tag: forward_intl_secondary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.nextdns.io/7f2fac
          enable_pipeline: true
          socks5: 127.0.0.1:6153
        - addr: https://dns.adguard-dns.com/dns-query
          enable_pipeline: true
          socks5: 127.0.0.1:6153
        - addr: https://adblock.dns.mullvad.net/dns-query
          enable_pipeline: true
          socks5: 127.0.0.1:6153

  # 4. Sequences
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_cn_primary
      - matches: "!resp_ip $cn_ip_matcher"
        exec: $forward_cn_secondary
      - matches: "!resp_ip $cn_ip_matcher"
        exec: reject 3
      - exec: accept

  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_intl_primary
      - matches: resp_ip $cn_ip_matcher
        exec: $forward_intl_secondary
      - matches: resp_ip $cn_ip_matcher
        exec: reject 3
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence
      - exec: jump intl_sequence

  # 5. Servers
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5335

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5335

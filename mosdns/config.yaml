  # ────────────────────────────────────────────────────────────────────
  # 3. 隐身化上游矩阵 (Evasion Optimized)
  # ────────────────────────────────────────────────────────────────────
  
  # Google
  - tag: forward_google
    type: forward
    args:
      upstreams:
        - addr: "https://dns.google/dns-query"
          socks5: "127.0.0.1:9810"

  # Cloudflare
  - tag: forward_cloudflare
    type: forward
    args:
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          socks5: "127.0.0.1:9810"

  # MS / Wikimedia
  - tag: forward_ms
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "https://wikimedia-dns.org/dns-query"
          socks5: "127.0.0.1:9810"
        - addr: "https://[2620:fe::fe]/dns-query"
          socks5: "127.0.0.1:9810"

  # 国内“隐身版”解析池 (强制 DoH + 非敏 IP)
  - tag: forward_cn_general
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://dns.alidns.com/dns-query"
        - addr: "https://doh.pub/dns-query"
        - addr: "180.184.1.1"
        - addr: "114.114.114.114"
        - addr: "2400:da00::6666"

  # 国际通用隐身对齐
  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "https://dns.google/dns-query"
          socks5: "127.0.0.1:9810"
        - addr: "https://cloudflare-dns.com/dns-query"
          socks5: "127.0.0.1:9810"

  # 引导解析 (Bootstrap) - 国内直连
  - tag: forward_bootstrap_direct
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "223.5.5.5"
        - addr: "119.29.29.29"

  # ────────────────────────────────────────────────────────────────────
  # 4. 逻辑序列
  # ────────────────────────────────────────────────────────────────────
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_cn_general
      - exec: accept

  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_ms
      - matches: "!resp_ip $cn_ip_matcher"
        exec: accept
      - exec: $forward_cn_general
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $hosts
      - exec: $cache

      - matches: qtype 65
        exec: reject 3 
      - matches: qtype 46 47 48
        exec: reject 3

      - matches: qname $matcher_bootstrap
        exec: $forward_bootstrap_direct
      - matches: qname $matcher_bootstrap
        exec: accept

      - matches: qname $matcher_nsfw
        exec: $forward_intl_general
      - matches: qname $matcher_nsfw
        exec: accept

      - matches: qname $matcher_apple
        exec: $forward_cn_general
      - matches: qname $matcher_apple
        exec: accept

      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept

      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept

      - matches: qname $matcher_microsoft
        exec: $forward_ms
      - matches: qname $matcher_microsoft
        exec: accept

      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence

      - exec: jump intl_sequence

  # ────────────────────────────────────────────────────────────────────
  # 5. 服务器绑定 (IPv4 + IPv6)
  # ────────────────────────────────────────────────────────────────────
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:6053"}

  - tag: udp_server_v6
    type: udp_server
    args: {entry: main_sequence, listen: "[::1]:6053"}

  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:6053"}

  - tag: tcp_server_v6
    type: tcp_server
    args: {entry: main_sequence, listen: "[::1]:6053"}

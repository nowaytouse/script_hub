# mosdns Configuration - Ultra-Granular Global Steering
# Version: 2026.04.18c
# Fix: removed IP verification from cn_sequence to break Surge SOCKS5 deadlock.
#      CN domains always trust CN resolver answer (no intl fallback loop).

log:
  level: info
  file: "/tmp/mosdns.log"
  production: true

plugins:
  # ── Cache ──────────────────────────────────────
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # ── Domain Matchers ────────────────────────────
  - tag: matcher_apple
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Apple.txt"]}
  - tag: matcher_google
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Google.txt", "/Users/nyamiiko/.mosdns/data/steer_GitHub.txt"]}
  - tag: matcher_microsoft
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Microsoft.txt"]}
  - tag: matcher_ai_cf
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_AI.txt", "/Users/nyamiiko/.mosdns/data/steer_Cloudflare.txt"]}
  - tag: matcher_nsfw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/nsfw_domain.txt"]}
  - tag: matcher_tw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_StreamTW.txt"]}
  - tag: matcher_social
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_SocialMedia.txt"]}
  - tag: matcher_tiktok
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_TikTok.txt"]}
  - tag: matcher_ali
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_ali.txt"]}
  - tag: matcher_tencent
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_tencent.txt"]}
  - tag: matcher_bootstrap
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Bootstrap.txt"]}
  - tag: cn_domain_matcher
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_domain.txt"]}

  # ── IP Matcher (CN, v4+v6 combined) ───────────
  # cn_ip.txt should contain both IPv4 and IPv6 CN CIDRs.
  # Only used by intl_sequence to detect CN-CDN responses.
  - tag: cn_ip_matcher
    type: ip_set
    args:
      files:
        - "/Users/nyamiiko/.mosdns/data/cn_ip.txt"

  # ── Forwarders ─────────────────────────────────
  - tag: forward_apple
    type: forward
    args: {upstreams: [{addr: "https://doh.dns.apple.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_google
    type: forward
    args: {upstreams: [{addr: "https://dns.google/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_quad9
    type: forward
    args: {upstreams: [{addr: "https://dns.quad9.net/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_cloudflare
    type: forward
    args: {upstreams: [{addr: "https://cloudflare-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_wikimedia_privacy
    type: forward
    args: {upstreams: [{addr: "https://wikimedia-dns.org/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_twnic
    type: forward
    args: {upstreams: [{addr: "https://dns.twnic.tw/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_adguard_social
    type: forward
    args: {upstreams: [{addr: "https://dns.adguard-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_ali
    type: forward
    args: {upstreams: [{addr: "https://dns.alidns.com/dns-query", enable_pipeline: true}]}
  - tag: forward_tencent
    type: forward
    args: {upstreams: [{addr: "https://doh.pub/dns-query", enable_pipeline: true}]}

  # UDP + TCP both for EDNS truncation prevention
  - tag: forward_smartdns_cn
    type: forward
    args:
      upstreams:
        - addr: "udp://127.0.0.1:6353"
        - addr: "tcp://127.0.0.1:6353"

  - tag: forward_smartdns_intl
    type: forward
    args:
      upstreams:
        - addr: "udp://127.0.0.1:6354"
        - addr: "tcp://127.0.0.1:6354"

  # Bootstrap: plain UDP — no DoH, no proxy
  - tag: forward_bootstrap
    type: forward
    args:
      concurrent: 5
      upstreams:
        - addr: "223.5.5.5"
        - addr: "[2400:3200::1]:53"
        - addr: "119.29.29.29"
        - addr: "[2402:4e00::]:53"
        - addr: "[2620:fe::fe]:53"
        - addr: "1.1.1.1"

  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.google/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://cloudflare-dns.com/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://dns.quad9.net/dns-query
          socks5: 127.0.0.1:6153

  # ── Sequences ──────────────────────────────────

  - tag: nsfw_sequence
    type: sequence
    args:
      - exec: $forward_wikimedia_privacy
      - exec: accept

  - tag: tiktok_sequence
    type: sequence
    args:
      - exec: $forward_intl_general
      - exec: accept

  # CN sequence: trust CN resolver answer unconditionally.
  # NO IP verification — avoids Surge SOCKS5 deadlock when CN domain
  # resolves to non-CN CDN IP (Akamai, Fastly, etc.).
  # CN resolvers always return the optimal CN/HK CDN node anyway.
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_cn
      - exec: accept

  # Intl sequence: verify response is NOT a CN IP.
  # If CN IP returned (intl domain on CN CDN), fallback to CN resolver.
  # This direction is safe — cn_sequence has no proxy dependency.
  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_intl
      - matches: "!resp_ip $cn_ip_matcher"
        exec: accept
      # Intl domain returned CN IP → use CN resolver path
      - exec: $forward_smartdns_cn
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      # Bootstrap
      - matches: qname $matcher_bootstrap
        exec: $forward_bootstrap
      - matches: qname $matcher_bootstrap
        exec: accept
      # NSFW (privacy routing, not blocking)
      - matches: qname $matcher_nsfw
        exec: jump nsfw_sequence
      # TikTok
      - matches: qname $matcher_tiktok
        exec: jump tiktok_sequence
      # Per-vendor steering
      - matches: qname $matcher_apple
        exec: $forward_apple
      - matches: qname $matcher_apple
        exec: accept
      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept
      - matches: qname $matcher_microsoft
        exec: $forward_quad9
      - matches: qname $matcher_microsoft
        exec: accept
      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept
      - matches: qname $matcher_tw
        exec: $forward_twnic
      - matches: qname $matcher_tw
        exec: accept
      - matches: qname $matcher_social
        exec: $forward_adguard_social
      - matches: qname $matcher_social
        exec: accept
      # CN Vendors — direct
      - matches: qname $matcher_ali
        exec: $forward_ali
      - matches: qname $matcher_ali
        exec: accept
      - matches: qname $matcher_tencent
        exec: $forward_tencent
      - matches: qname $matcher_tencent
        exec: accept
      # General split
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence
      - exec: jump intl_sequence

  # ── Servers ────────────────────────────────────
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}
  - tag: udp_server_v6
    type: udp_server
    args: {entry: main_sequence, listen: "[::1]:53"}
  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}
  - tag: tcp_server_v6
    type: tcp_server
    args: {entry: main_sequence, listen: "[::1]:53"}
  - tag: doh_server
    type: http_server
    args:
      listen: "127.0.0.1:5336"
      entries:
        - path: /dns-query
          exec: main_sequence
  - tag: doh_server_v6
    type: http_server
    args:
      listen: "[::1]:5336"
      entries:
        - path: /dns-query
          exec: main_sequence
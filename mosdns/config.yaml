# mosdns Configuration - Ultra-Granular Global Steering (Absolute Path + Correct Order)
# Version: 2026.04.17a
# Strategy: Full alignment with Surge Module. Fixed plugin order for stability.
# CN + intl fallback chain into local smartdns-rs (127.0.0.1:6353/6354) for fastest-IP + TTL smoothing.

log:
  level: info
  file: "/tmp/mosdns.log"
  production: true

plugins:
  # 1. Cache
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # 2. Matchers (Domain Sets)
  - tag: matcher_apple
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Apple.txt"]}
  - tag: matcher_google
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Google.txt", "/Users/nyamiiko/.mosdns/data/steer_GitHub.txt"]}
  - tag: matcher_microsoft
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Microsoft.txt"]}
  - tag: matcher_ai_cf
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_AI.txt", "/Users/nyamiiko/.mosdns/data/steer_Cloudflare.txt"]}
  - tag: matcher_nsfw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/nsfw_domain.txt"]}
  - tag: matcher_tw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_StreamTW.txt"]}
  - tag: matcher_social
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_SocialMedia.txt"]}
  - tag: matcher_ali
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_ali.txt"]}
  - tag: matcher_tencent
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_tencent.txt"]}
  - tag: cn_domain_matcher
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_domain.txt"]}
  - tag: cn_ip_matcher
    type: ip_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_ip.txt"]}

  # 3. Forwarders
  - tag: forward_apple
    type: forward
    args: {upstreams: [{addr: "https://doh.dns.apple.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_google
    type: forward
    args: {upstreams: [{addr: "https://dns.google/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_quad9
    type: forward
    args: {upstreams: [{addr: "https://dns.quad9.net/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_cloudflare
    type: forward
    args: {upstreams: [{addr: "https://cloudflare-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_wikimedia_privacy
    type: forward
    args: {upstreams: [{addr: "https://wikimedia-dns.org/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_twnic
    type: forward
    args: {upstreams: [{addr: "https://dns.twnic.tw/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_adguard_social
    type: forward
    args: {upstreams: [{addr: "https://dns.adguard-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_ali
    type: forward
    args: {upstreams: [{addr: "https://dns.alidns.com/dns-query", enable_pipeline: true}]}
  - tag: forward_tencent
    type: forward
    args: {upstreams: [{addr: "https://doh.pub/dns-query", enable_pipeline: true}]}
  - tag: forward_smartdns_cn
    type: forward
    args: {upstreams: [{addr: "udp://127.0.0.1:6353"}]}
  - tag: forward_smartdns_intl
    type: forward
    args: {upstreams: [{addr: "udp://127.0.0.1:6354"}]}
  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.google/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://cloudflare-dns.com/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://dns.quad9.net/dns-query
          socks5: 127.0.0.1:6153

  # 4. Sequences (Define dependent ones first)
  - tag: nsfw_sequence
    type: sequence
    args:
      - exec: $forward_wikimedia_privacy
      - exec: accept

  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_cn
      - matches: "!resp_ip $cn_ip_matcher"
        exec: reject 3
      - exec: accept

  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_intl
      - matches: resp_ip $cn_ip_matcher
        exec: reject 3
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      # NSFW
      - matches: qname $matcher_nsfw
        exec: jump nsfw_sequence
      # Specialized Steering
      - matches: qname $matcher_apple
        exec: $forward_apple
      - matches: qname $matcher_apple
        exec: accept
      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept
      - matches: qname $matcher_microsoft
        exec: $forward_quad9
      - matches: qname $matcher_microsoft
        exec: accept
      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept
      - matches: qname $matcher_tw
        exec: $forward_twnic
      - matches: qname $matcher_tw
        exec: accept
      - matches: qname $matcher_social
        exec: $forward_adguard_social
      - matches: qname $matcher_social
        exec: accept
      # CN Vendors
      - matches: qname $matcher_ali
        exec: $forward_ali
      - matches: qname $matcher_ali
        exec: accept
      - matches: qname $matcher_tencent
        exec: $forward_tencent
      - matches: qname $matcher_tencent
        exec: accept
      # General Split
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence
      - exec: jump intl_sequence

  # 5. Servers
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:5335"}
  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:5335"}
  - tag: doh_server
    type: http_server
    args:
      listen: "127.0.0.1:5336"
      entries:
        - path: /dns-query
          exec: main_sequence

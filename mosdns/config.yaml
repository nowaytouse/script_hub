# mosdns Configuration - Ultimate Stealth Edition (Hardened v4.0)
# Version: 2026.04.21-Stealth_Evasion_Enabled
# ══════════════════════════════════════════════════════════════════════

log:
  level: info
  file: "/Users/nyamiiko/Library/Logs/mosdns.log"

plugins:
  # ────────────────────────────────────────────────────────────────────
  # 1. 内部 Hosts (脱敏 & 绕避 Surge HTTPDNS_Hijack 审计)
  # ────────────────────────────────────────────────────────────────────
  - tag: hosts
    type: hosts
    args:
      entries:
        - "dns.google 8.8.4.4"                # 避开 8.8.8.8
        - "dns.google 2001:4860:4860::8888"   # 优先 IPv6
        - "cloudflare-dns.com 1.0.0.1"        # 避开 1.1.1.1
        - "cloudflare-dns.com 2606:4700:4700::1111"
        - "dns.quad9.net 149.112.112.112"     # 避开 9.9.9.9
        - "dns.quad9.net 2620:fe::fe"
        - "dns.alidns.com 2400:3200::1"       # 国内 IPv6 脱敏 (避开 223.5.5.5)
        - "doh.pub 2402:4e00::"               # 腾讯 IPv6 脱敏 (避开 119.29.29.29)
        - "doh.360.cn 101.124.19.122"         # 360 备选非敏 IP

  - tag: cache
    type: cache
    args:
      size: 65535

  # ────────────────────────────────────────────────────────────────────
  # 2. 规则集：12w+ 域名全量精细化
  # ────────────────────────────────────────────────────────────────────
  - tag: matcher_apple
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_Apple.txt"]}

  - tag: matcher_google
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_Google.txt"]}

  - tag: matcher_github
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_GitHub.txt"]}

  - tag: matcher_microsoft
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_Microsoft.txt"]}

  - tag: matcher_ai_cf
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_AI.txt"]}

  - tag: matcher_nsfw
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/nsfw_domain.txt"]}

  - tag: matcher_tw
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_StreamTW.txt"]}

  - tag: matcher_social
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_SocialMedia.txt"]}

  - tag: matcher_tiktok
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_TikTok.txt"]}

  - tag: matcher_airport
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/steer_Airport.txt"]}

  - tag: cn_domain_matcher
    type: domain_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/cn_domain.txt"]}

  - tag: cn_ip_matcher
    type: ip_set
    args: {files: ["/Users/nyamiiko/Downloads/GitHub/script_hub/mosdns/rules/mosdns/cn_ip.txt"]}

  # ────────────────────────────────────────────────────────────────────
  # 3. 隐身化上游矩阵 (Evasion Optimized)
  # ────────────────────────────────────────────────────────────────────
  
  # Google
  - tag: forward_google
    type: forward
    args:
      upstreams:
        - addr: "https://dns.google/dns-query"
          socks5: "127.0.0.1:6153"

  # Cloudflare
  - tag: forward_cloudflare
    type: forward
    args:
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          socks5: "127.0.0.1:6153"

  # MS / Wikimedia
  - tag: forward_ms
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://wikimedia-dns.org/dns-query"
          socks5: "127.0.0.1:6153"
        - addr: "https://dns.quad9.net/dns-query"
          socks5: "127.0.0.1:6153"

  # 国内“隐身版”解析池 (强制 DoH + 非敏 IP)
  - tag: forward_cn_general
    type: forward
    args:
      concurrent: 5
      upstreams:
        - addr: "https://dns.alidns.com/dns-query" # 域名形态 (经 Hosts 脱敏)
        - addr: "https://doh.pub/dns-query"        # 域名形态 (经 Hosts 脱敏)
        - addr: "https://doh.360.cn/dns-query"
        - addr: "180.184.1.1"                      # 字节跳动 (不在劫持名单)
        - addr: "114.114.114.114"                  # 114DNS (不在劫持名单)
        - addr: "2400:da00::6666"                  # 百度 IPv6

  # 国际通用隐身对齐
  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "https://dns.google/dns-query"
          socks5: "127.0.0.1:6153"
        - addr: "https://cloudflare-dns.com/dns-query"
          socks5: "127.0.0.1:6153"
        - addr: "https://wikimedia-dns.org/dns-query"
          socks5: "127.0.0.1:6153"

  # 引导解析 (Bootstrap) - 强制 IPv6 优先
  - tag: forward_bootstrap_direct
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "2400:3200::1"    # 阿里 IPv6
        - addr: "2402:4e00::"     # 腾讯 IPv6
        - addr: "114.114.114.114" # 114 备选

  # ────────────────────────────────────────────────────────────────────
  # 4. 逻辑序列
  # ────────────────────────────────────────────────────────────────────
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_cn_general
      - exec: accept

  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_ms
      - matches: "!resp_ip $cn_ip_matcher"
        exec: accept
      - exec: $forward_cn_general
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $hosts
      - exec: $cache

      # QUIC/HTTPS 拦截项
      - matches: qtype 65
        exec: reject 3 
      - matches: qtype 46 47 48
        exec: reject 3

      - matches: qname $matcher_bootstrap
        exec: $forward_bootstrap_direct
      - matches: qname $matcher_bootstrap
        exec: accept

      - matches: qname $matcher_nsfw
        exec: $forward_intl_general
      - matches: qname $matcher_nsfw
        exec: accept

      - matches: qname $matcher_apple
        exec: $forward_cn_general
      - matches: qname $matcher_apple
        exec: accept

      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept

      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept

      - matches: qname $matcher_microsoft
        exec: $forward_ms
      - matches: qname $matcher_microsoft
        exec: accept

      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence

      - exec: jump intl_sequence

  # ────────────────────────────────────────────────────────────────────
  # 5. 服务启动
  # ────────────────────────────────────────────────────────────────────
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:6053"}

  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:6053"}

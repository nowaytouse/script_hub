# mosdns Configuration - Ultra-Granular Global Steering (Absolute Path + Correct Order)
# Version: 2026.04.18a
# Strategy: Full alignment with Surge Module. Fixed plugin order for stability.
# CN + intl fallback chain into local smartdns-rs (127.0.0.1:6353/6354) for fastest-IP + TTL smoothing.
#
# CHANGES from 2026.04.17a:
#   [HIGH]  cn_ip_matcher / cn_ip_matcher_v6: split into dual ip_set so IPv6 AAAA responses
#           are correctly classified in cn_sequence and intl_sequence.
#   [MED]   cn_sequence: on IP-mismatch, fallback to intl_sequence instead of hard reject,
#           handles CN domains on Cloudflare/Fastly CDN gracefully.
#   [MED]   intl_sequence: same — on CN-IP response, retry via cn_sequence rather than reject.
#   [LOW]   bootstrap forwarder: removed Google 8888 IPv6 (semantically wrong for CN bootstrap);
#           added Quad9 IPv6 as neutral fallback.
#   [LOW]   nsfw_sequence: clarified intent comment (privacy routing, NOT blocking).
#           To block instead: replace exec with "reject 3".
#   [INFO]  IPv6 listeners ([::1]:53 / [::1]:5336) were already present — no change needed.
#           macOS: binding :53 requires root (sudo) or use a high port + Surge redirect.

log:
  level: info
  file: "/tmp/mosdns.log"
  production: true

plugins:
  # ──────────────────────────────────────────────
  # 1. Cache
  # ──────────────────────────────────────────────
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # ──────────────────────────────────────────────
  # 2. Matchers (Domain Sets)
  # ──────────────────────────────────────────────
  - tag: matcher_apple
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Apple.txt"]}
  - tag: matcher_google
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Google.txt", "/Users/nyamiiko/.mosdns/data/steer_GitHub.txt"]}
  - tag: matcher_microsoft
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Microsoft.txt"]}
  - tag: matcher_ai_cf
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_AI.txt", "/Users/nyamiiko/.mosdns/data/steer_Cloudflare.txt"]}
  - tag: matcher_nsfw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/nsfw_domain.txt"]}
  - tag: matcher_tw
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_StreamTW.txt"]}
  - tag: matcher_social
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_SocialMedia.txt"]}
  - tag: matcher_tiktok
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_TikTok.txt"]}
  - tag: matcher_ali
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_ali.txt"]}
  - tag: matcher_tencent
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/vendor_tencent.txt"]}
  - tag: matcher_bootstrap
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/steer_Bootstrap.txt"]}
  - tag: cn_domain_matcher
    type: domain_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_domain.txt"]}

  # ── IP matchers ──
  # FIX: Split into two ip_set plugins (IPv4 + IPv6) so AAAA responses are
  # correctly classified in cn_sequence and intl_sequence.
  # cn_ip.txt    → IPv4 CN CIDRs  (e.g. from ipinfo/china or APNIC delegated)
  # cn_ip_v6.txt → IPv6 CN CIDRs  (e.g. CNNIC delegated, 2400::/12 etc.)
  # If you combine both in one file, merge them back into a single ip_set.
  - tag: cn_ip_matcher
    type: ip_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_ip.txt"]}
  - tag: cn_ip_v6_matcher
    type: ip_set
    args: {files: ["/Users/nyamiiko/.mosdns/data/cn_ip_v6.txt"]}

  # ──────────────────────────────────────────────
  # 3. Forwarders
  # ──────────────────────────────────────────────
  - tag: forward_apple
    type: forward
    args: {upstreams: [{addr: "https://doh.dns.apple.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_google
    type: forward
    args: {upstreams: [{addr: "https://dns.google/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_quad9
    type: forward
    args: {upstreams: [{addr: "https://dns.quad9.net/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_cloudflare
    type: forward
    args: {upstreams: [{addr: "https://cloudflare-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_wikimedia_privacy
    type: forward
    args: {upstreams: [{addr: "https://wikimedia-dns.org/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_twnic
    type: forward
    args: {upstreams: [{addr: "https://dns.twnic.tw/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_adguard_social
    type: forward
    args: {upstreams: [{addr: "https://dns.adguard-dns.com/dns-query", enable_pipeline: true, socks5: 127.0.0.1:6153}]}
  - tag: forward_ali
    type: forward
    args: {upstreams: [{addr: "https://dns.alidns.com/dns-query", enable_pipeline: true}]}
  - tag: forward_tencent
    type: forward
    args: {upstreams: [{addr: "https://doh.pub/dns-query", enable_pipeline: true}]}
  - tag: forward_smartdns_cn
    type: forward
    args: {upstreams: [{addr: "udp://127.0.0.1:6353"}]}
  - tag: forward_smartdns_intl
    type: forward
    args: {upstreams: [{addr: "udp://127.0.0.1:6354"}]}

  # Bootstrap: resolves hostnames of CN DoH providers WITHOUT going through DoH itself.
  # FIX: removed Google 8888 IPv6 (inconsistent with CN-bootstrap intent).
  #      Added Quad9 IPv6 (2620:fe::fe) as neutral anycast fallback.
  - tag: forward_bootstrap
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "https://[2400:3200::1]/dns-query"       # AliDNS IPv6
        - addr: "https://[2402:4e00::]/dns-query"        # Tencent DNSPod IPv6
        - addr: "https://[2620:fe::fe]/dns-query"        # Quad9 IPv6 (neutral fallback)

  - tag: forward_intl_general
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.google/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://cloudflare-dns.com/dns-query
          socks5: 127.0.0.1:6153
        - addr: https://dns.quad9.net/dns-query
          socks5: 127.0.0.1:6153

  # ──────────────────────────────────────────────
  # 4. Sequences (Define dependent ones first)
  # ──────────────────────────────────────────────

  # NSFW intent: routes to a privacy-focused resolver (Wikimedia), NOT blocking.
  # To BLOCK NSFW domains instead, replace the two lines below with:
  #   - exec: reject 3
  - tag: nsfw_sequence
    type: sequence
    args:
      - exec: $forward_wikimedia_privacy
      - exec: accept

  - tag: tiktok_sequence
    type: sequence
    args:
      - exec: $forward_intl_general
      - exec: accept

  # CN sequence: query smartdns-rs CN group, verify response IP is CN.
  # FIX: checks both IPv4 (cn_ip_matcher) and IPv6 (cn_ip_v6_matcher).
  # FIX: on IP-mismatch (e.g. CN domain on Cloudflare CDN), fall through to
  #      intl_sequence instead of hard-rejecting — avoids broken resolution.
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_cn
      # Accept immediately if response IP is CN (IPv4 or IPv6)
      - matches: "resp_ip $cn_ip_matcher"
        exec: accept
      - matches: "resp_ip $cn_ip_v6_matcher"
        exec: accept
      # Non-CN IP for a CN domain → domain is on intl CDN, fall to intl path
      - exec: $forward_smartdns_intl
      - exec: accept

  # Intl sequence: query smartdns-rs Intl group, verify response IP is NOT CN.
  # FIX: checks both IPv4 and IPv6 cn matchers.
  # FIX: on CN-IP response (intl domain on CN CDN), fall to cn_sequence.
  - tag: intl_sequence
    type: sequence
    args:
      - exec: $forward_smartdns_intl
      # If response IP is NOT CN → good, accept
      - matches: "!resp_ip $cn_ip_matcher"
        exec: accept
      - matches: "!resp_ip $cn_ip_v6_matcher"
        exec: accept
      # CN IP for intl domain → domain uses CN CDN, fall to cn_sequence
      - exec: $forward_smartdns_cn
      - exec: accept

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      # Bootstrap DNS (resolves CN DoH provider hostnames before DoH is available)
      - matches: qname $matcher_bootstrap
        exec: $forward_bootstrap
      - matches: qname $matcher_bootstrap
        exec: accept
      # NSFW — privacy routing (see nsfw_sequence comment above re: blocking)
      - matches: qname $matcher_nsfw
        exec: jump nsfw_sequence
      # TikTok — routed through intl general (comment policy compliance)
      - matches: qname $matcher_tiktok
        exec: jump tiktok_sequence
      # Specialized per-vendor steering
      - matches: qname $matcher_apple
        exec: $forward_apple
      - matches: qname $matcher_apple
        exec: accept
      - matches: qname $matcher_google
        exec: $forward_google
      - matches: qname $matcher_google
        exec: accept
      - matches: qname $matcher_microsoft
        exec: $forward_quad9
      - matches: qname $matcher_microsoft
        exec: accept
      - matches: qname $matcher_ai_cf
        exec: $forward_cloudflare
      - matches: qname $matcher_ai_cf
        exec: accept
      - matches: qname $matcher_tw
        exec: $forward_twnic
      - matches: qname $matcher_tw
        exec: accept
      - matches: qname $matcher_social
        exec: $forward_adguard_social
      - matches: qname $matcher_social
        exec: accept
      # CN Vendors (direct, no proxy)
      - matches: qname $matcher_ali
        exec: $forward_ali
      - matches: qname $matcher_ali
        exec: accept
      - matches: qname $matcher_tencent
        exec: $forward_tencent
      - matches: qname $matcher_tencent
        exec: accept
      # General split: CN domain list → cn_sequence, everything else → intl_sequence
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence
      - exec: jump intl_sequence

  # ──────────────────────────────────────────────
  # 5. Servers
  # NOTE: Binding :53 on macOS requires root (sudo mosdns).
  #       Alternative: use port 5335 here and configure Surge to redirect 53 → 5335.
  # ──────────────────────────────────────────────
  - tag: udp_server
    type: udp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}
  - tag: udp_server_v6
    type: udp_server
    args: {entry: main_sequence, listen: "[::1]:53"}
  - tag: tcp_server
    type: tcp_server
    args: {entry: main_sequence, listen: "127.0.0.1:53"}
  - tag: tcp_server_v6
    type: tcp_server
    args: {entry: main_sequence, listen: "[::1]:53"}
  - tag: doh_server
    type: http_server
    args:
      listen: "127.0.0.1:5336"
      entries:
        - path: /dns-query
          exec: main_sequence
  - tag: doh_server_v6
    type: http_server
    args:
      listen: "[::1]:5336"
      entries:
        - path: /dns-query
          exec: main_sequence
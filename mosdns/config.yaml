# mosdns Configuration - Dual-Track DNS with Zero Cross-Contamination
# Version: 2026.04.16b
# Author: nyamiiko
#
# Architecture:
# Surge → 127.0.0.1:5335 (mosdns)
#   ↓
# CN domains → Mainland DoH (AliDNS/DNSPod/360/Baidu/Volcengine)
# International domains → International DoH (Cloudflare/Google/Quad9/NextDNS/AdGuard/Mullvad/Wikimedia/LibreDNS/ControlD via proxy)
#
# Features:
# - Multi-tier fallback for both CN and international DoH
# - Anti-pollution validation with automatic fallback
# - ECS support for mainland queries
# - 10K entry cache with disk persistence

log:
  level: info
  file: "/tmp/mosdns.log"

# Data sources
data_providers:
  - tag: geosite
    file: ./geosite.dat
    auto_reload: true

  - tag: geoip
    file: ./geoip.dat
    auto_reload: true

  - tag: cn_domain
    file: ./cn_domain.txt
    auto_reload: true

# Plugin definitions
plugins:
  # Cache
  - tag: cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 86400
      dump_file: /tmp/mosdns_cache.dump
      dump_interval: 600

  # Mainland domain matcher
  - tag: cn_domain_matcher
    type: domain_set
    args:
      files:
        - ./cn_domain.txt

  # Mainland IP matcher
  - tag: cn_ip_matcher
    type: ip_set
    args:
      files:
        - ./cn_ip.txt

  # Mainland DoH forwarder - Primary (AliDNS + DNSPod)
  - tag: forward_cn_primary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.alidns.com/dns-query
          enable_pipeline: true
          enable_http3: false
        - addr: https://doh.pub/dns-query
          enable_pipeline: true
          enable_http3: false
        - addr: https://doh.360.cn/dns-query
          enable_pipeline: true
          enable_http3: false

  # Mainland DoH forwarder - Secondary (Backup)
  - tag: forward_cn_secondary
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: https://dns.baidu.com/dns-query
          enable_pipeline: true
          enable_http3: false
        - addr: https://dns.volcengine.com/dns-query
          enable_pipeline: true
          enable_http3: false

  # International DoH forwarder - Primary (Cloudflare + Google via proxy)
  - tag: forward_intl_primary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://cloudflare-dns.com/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://dns.google/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://dns.quad9.net/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810

  # International DoH forwarder - Secondary (Privacy-focused via proxy)
  - tag: forward_intl_secondary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://dns.nextdns.io/7f2fac
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://dns.adguard-dns.com/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://adblock.dns.mullvad.net/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810

  # International DoH forwarder - Tertiary (Additional providers via proxy)
  - tag: forward_intl_tertiary
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://wikimedia-dns.org/dns-query
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://doh.libredns.gr/noads
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810
        - addr: https://freedns.controld.com/p1
          enable_pipeline: true
          enable_http3: false
          socks5: 127.0.0.1:9810

  # ECS for mainland queries
  - tag: ecs_cn
    type: ecs
    args:
      auto: true
      force_overwrite: false
      mask4: 24
      mask6: 48

  # Main sequence
  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache

      # Check if domain is mainland
      - matches: qname $cn_domain_matcher
        exec: jump cn_sequence

      # Check if domain ends with .cn
      - matches: qname suffix:.cn
        exec: jump cn_sequence

      # Default: international sequence
      - exec: jump intl_sequence

  # Mainland sequence
  - tag: cn_sequence
    type: sequence
    args:
      - exec: $ecs_cn
      # Try primary mainland DoH
      - exec: $forward_cn_primary
      # If primary fails or returns non-CN IP, try secondary
      - matches: "!resp_ip $cn_ip_matcher"
        exec: $forward_cn_secondary
      # Final validation: reject if still not CN IP
      - matches: "!resp_ip $cn_ip_matcher"
        exec: reject 3  # NXDOMAIN if response IP is not CN
      - exec: accept

  # International sequence
  - tag: intl_sequence
    type: sequence
    args:
      # Try primary international DoH
      - exec: $forward_intl_primary
      # If primary fails or returns CN IP (pollution), try secondary
      - matches: resp_ip $cn_ip_matcher
        exec: $forward_intl_secondary
      # If secondary also fails, try tertiary
      - matches: resp_ip $cn_ip_matcher
        exec: $forward_intl_tertiary
      # Final validation: reject if still CN IP (pollution)
      - matches: resp_ip $cn_ip_matcher
        exec: reject 3  # NXDOMAIN if response IP is CN (pollution)
      - exec: accept

# Server
servers:
  - exec: main_sequence
    listeners:
      - protocol: udp
        addr: 127.0.0.1:5335
      - protocol: tcp
        addr: 127.0.0.1:5335

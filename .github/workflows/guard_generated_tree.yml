name: Guard Generated Tree

on:
  push:
    branches: [master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: create/processor

      - name: Validate PROMAX Rust
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path create/processor/Cargo.toml 'promax::' -- --test-threads=1

      - name: Guard generated-tree edits
        run: cargo run --manifest-path create/processor/Cargo.toml --bin guard

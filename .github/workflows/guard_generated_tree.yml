name: Guard Generated Tree

on:
  push:
    branches: [master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust Static Library
        run: |
          cd go_scripts/rust_processor
          cargo build --release

      - name: Guard generated-tree edits
        run: |
          cd go_scripts
          go run ./cmd/guard


name: Update Rulesets

# ═══════════════════════════════════════════════════════════════
# GitHub Actions — ruleset auto maintenance (canonical updater)
#
# Triggers:
#   • schedule — 3×/day (Beijing 12:17, 20:17, 04:17; :17 avoids :00 queue delays)
#   • workflow_dispatch — manual
#   • push master — skipped only for github-actions[bot] chore(ruleset) (anti-loop)
#
# Before git push: wait ≥3 min (PUSH_COOLDOWN), then pull --rebase, then push.
#
# Scope (CI only):
#   ✅ Ruleset update, dedup, SRS (sing-box), git push
#   ❌ Backup / core update / iCloud / Surge profile (local)
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - master
  schedule:
    # UTC 04:17 / 12:17 / 20:17 → Beijing 12:17 / 20:17 / 次日 04:17
    - cron: '17 4,12,20 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PUSH_COOLDOWN_ENABLED: 'true'
  PUSH_COOLDOWN_SECONDS: '180'   # ≥3 min before push; set 1800 for 30 min if needed

concurrency:
  group: update-rulesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skip only bot's own chore(ruleset) push (prevents push→immediate re-run loop)
    if: >-
      github.event_name != 'push' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, 'chore(ruleset)')
      )
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

    - name: Resolve sing-box version
      id: singbox_version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        PIN_FILE=".github/ci/sing-box-linux-amd64.version"

        try_api_latest() {
          [ -n "${GITHUB_TOKEN:-}" ] || return 1
          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
            | jq -r '.tag_name // empty' | sed 's/^v//'
        }

        try_redirect_latest() {
          local url tag
          url=$(curl -fsSL --retry 3 --retry-delay 2 -o /dev/null -w '%{url_effective}' \
            "https://github.com/SagerNet/sing-box/releases/latest" || true)
          tag=$(echo "${url}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?' | tail -1 | sed 's/^v//')
          [ -n "${tag}" ] && echo "${tag}"
        }

        try_pinned() {
          [ -f "${PIN_FILE}" ] && tr -d ' \n\r' < "${PIN_FILE}"
        }

        VER=""
        for resolver in try_api_latest try_redirect_latest try_pinned; do
          VER=$(${resolver} 2>/dev/null || true)
          [ -n "${VER}" ] && break
        done

        if [ -z "${VER}" ]; then
          echo "::error::Could not resolve sing-box release version (API, redirect, and pin all failed)"
          exit 1
        fi

        echo "version=${VER}" >> "$GITHUB_OUTPUT"
        echo "Using sing-box ${VER}"

    - name: Cache sing-box binary
      id: cache_singbox
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/sing-box
        key: singbox-${{ steps.singbox_version.outputs.version }}-linux-amd64

    - name: Install sing-box (for SRS generation only)
      if: steps.cache_singbox.outputs.cache-hit != 'true'
      env:
        SINGBOX_VERSION: ${{ steps.singbox_version.outputs.version }}
      run: |
        set -euo pipefail
        echo "Installing sing-box v${SINGBOX_VERSION}"
        ARCHIVE="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
        URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${ARCHIVE}"
        MIRROR="https://ghproxy.net/${URL}"

        for attempt in 1 2 3; do
          if curl -fsSL --retry 3 --retry-delay 5 -o sing-box.tar.gz "${URL}"; then
            break
          fi
          echo "::warning::sing-box download attempt ${attempt} failed (primary URL)"
          if curl -fsSL --retry 3 --retry-delay 5 -o sing-box.tar.gz "${MIRROR}"; then
            echo "Downloaded via mirror"
            break
          fi
          if [ "${attempt}" -eq 3 ]; then
            echo "::error::Failed to download sing-box after 3 attempts"
            exit 1
          fi
          sleep 10
        done

        tar -xzf sing-box.tar.gz
        sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
        rm -rf sing-box.tar.gz "sing-box-${SINGBOX_VERSION}-linux-amd64"

    - name: Verify sing-box
      run: sing-box version

    - name: Surge compliance regression tests
      run: python3 scripts/tools/test_surge_compliance.py

    - name: Validate existing Surge rulesets
      run: python3 scripts/tools/validate_surge_rulesets.py

    - name: Execute Python Ruleset Update
      run: python3 scripts/main_update.py --unattended
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI: 'true'
        GITHUB_ACTIONS: 'true'
        PYTHONPATH: scripts

    - name: Summary
      run: |
        echo "## 📊 Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 File Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| MetaCubeX Rules | $(ls ruleset/MetaCubeX/*.list 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "| Surge Rules | $(ls ruleset/Surge\(Shadowkroket\)/*.list 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "| AdBlock Split | $(ls ruleset/AdBlock/*.list 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "| SingBox SRS | $(ls ruleset/SingBox/*.srs 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "| Sources Files | $(ls ruleset/Sources/Links/*_sources.txt 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "| Modules | $(ls module/surge\(main\)/*.sgmodule 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔑 Key Rulesets" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "ruleset/AdBlock" ]; then
          ADBLOCK_TOTAL=$(grep -hcv "^#\|^$" ruleset/AdBlock/*.list 2>/dev/null | awk '{s+=$1} END {print s}' || echo "0")
          echo "- **AdBlock (Total Split)**: ${ADBLOCK_TOTAL} rules" >> $GITHUB_STEP_SUMMARY
        elif [ -f "ruleset/Surge(Shadowkroket)/AdBlock.list" ]; then
          ADBLOCK_COUNT=$(grep -cv "^#\|^$" "ruleset/Surge(Shadowkroket)/AdBlock.list" 2>/dev/null || echo "0")
          echo "- **AdBlock**: ${ADBLOCK_COUNT} rules" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "ruleset/Surge(Shadowkroket)/ChinaDirect.list" ]; then
          CHINADIRECT_COUNT=$(grep -cv "^#\|^$" "ruleset/Surge(Shadowkroket)/ChinaDirect.list" 2>/dev/null || echo "0")
          echo "- **ChinaDirect** (DNS leak prevention): ${CHINADIRECT_COUNT} rules" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "ruleset/Surge(Shadowkroket)/GlobalProxy.list" ]; then
          GLOBALPROXY_COUNT=$(grep -cv "^#\|^$" "ruleset/Surge(Shadowkroket)/GlobalProxy.list" 2>/dev/null || echo "0")
          echo "- **GlobalProxy**: ${GLOBALPROXY_COUNT} rules" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "module/surge(main)/🔥 Firewall Port Blocker 🛡️🚫.sgmodule" ]; then
          FIREWALL_COUNT=$(grep -c "^DEST-PORT\|^IN-PORT\|^SRC-PORT" "module/surge(main)/🔥 Firewall Port Blocker 🛡️🚫.sgmodule" 2>/dev/null || echo "0")
          echo "- **Firewall** (port blocking): ${FIREWALL_COUNT} rules" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚙️ CI/CD Mode" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Ruleset update and merge" >> $GITHUB_STEP_SUMMARY
        echo "✅ Smart dedup and cleanup" >> $GITHUB_STEP_SUMMARY
        echo "✅ Port rules sync to firewall module" >> $GITHUB_STEP_SUMMARY
        echo "✅ SRS file generation" >> $GITHUB_STEP_SUMMARY
        echo "✅ Git commit and push (github-actions[bot])" >> $GITHUB_STEP_SUMMARY
        echo "✅ Parallel processing enabled" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "❌ Skip backup (CI=true)" >> $GITHUB_STEP_SUMMARY
        echo "❌ Skip core update (--unattended)" >> $GITHUB_STEP_SUMMARY
        echo "❌ Skip iCloud sync (--unattended)" >> $GITHUB_STEP_SUMMARY
        echo "❌ Skip Surge profile sync (--unattended)" >> $GITHUB_STEP_SUMMARY

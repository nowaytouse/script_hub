name: Update Rulesets

# ═══════════════════════════════════════════════════════════════
# GitHub Actions — ruleset auto maintenance (canonical updater)
#
# Triggers:
#   • schedule — 3×/day (Beijing 12:17, 20:17, 04:17; :17 avoids :00 queue delays)
#   • workflow_dispatch — manual
#
# Rust owns processing; the final shell step publishes only validated generated paths.
#
# Scope (CI only):
#   ✅ Ruleset update, dedup, SRS (sing-box), git push
#   ❌ Backup / core update / iCloud / Surge profile (local)
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    # UTC 04:17 / 12:17 / 20:17 → Beijing 12:17 / 20:17 / 次日 04:17
    - cron: '17 4,12,20 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: update-rulesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Configure Git for master publication
      if: github.ref == 'refs/heads/master'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Resolve sing-box version
      id: singbox_version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        PIN_FILE=".github/ci/sing-box-linux-amd64.version"

        try_api_latest() {
          local release version asset digest
          release=$(curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SagerNet/sing-box/releases/latest") || return 1
          version=$(jq -r '.tag_name // empty' <<<"${release}" | sed 's/^v//')
          asset="sing-box-${version}-linux-amd64.tar.gz"
          digest=$(jq -r --arg asset "${asset}" \
            '.assets[] | select(.name == $asset) | .digest // empty' <<<"${release}")
          [ -n "${version}" ] && [ -n "${digest}" ] || return 1
          printf '%s %s\n' "${version}" "${digest}"
        }

        try_pinned() {
          [ -f "${PIN_FILE}" ] && sed -n '1p' "${PIN_FILE}"
        }

        RESOLVED=$(try_api_latest 2>/dev/null || try_pinned)
        read -r VER DIGEST <<<"${RESOLVED}"
        if ! [[ "${VER:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] \
          || ! [[ "${DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::Could not resolve a trusted sing-box version and SHA256 digest"
          exit 1
        fi

        echo "version=${VER}" >> "$GITHUB_OUTPUT"
        echo "sha256=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
        echo "Using verified sing-box ${VER}"

    - name: Cache verified sing-box archive
      id: cache_singbox
      uses: actions/cache@v5
      with:
        path: .cache/sing-box/sing-box.tar.gz
        key: singbox-${{ steps.singbox_version.outputs.version }}-${{ steps.singbox_version.outputs.sha256 }}-linux-amd64

    - name: Install sing-box (for SRS generation only)
      env:
        SINGBOX_VERSION: ${{ steps.singbox_version.outputs.version }}
        SINGBOX_SHA256: ${{ steps.singbox_version.outputs.sha256 }}
        SINGBOX_CACHE_HIT: ${{ steps.cache_singbox.outputs.cache-hit }}
      run: |
        set -euo pipefail
        echo "Installing sing-box v${SINGBOX_VERSION}"
        ARCHIVE="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
        ARCHIVE_PATH=".cache/sing-box/sing-box.tar.gz"
        URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${ARCHIVE}"
        MIRROR="https://ghproxy.net/${URL}"
        mkdir -p "$(dirname "${ARCHIVE_PATH}")"

        if [ "${SINGBOX_CACHE_HIT}" != true ]; then
          verified=false
          for attempt in 1 2 3; do
            for candidate in "${URL}" "${MIRROR}"; do
              rm -f "${ARCHIVE_PATH}"
              if curl -fsSL --retry 3 --retry-delay 5 -o "${ARCHIVE_PATH}" "${candidate}" \
                && echo "${SINGBOX_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --status; then
                verified=true
                break 2
              fi
              echo "::warning::sing-box download or checksum verification failed on attempt ${attempt}: ${candidate}"
            done
            sleep 10
          done
          if [ "${verified}" != true ]; then
            echo "::error::Failed to download a verified sing-box archive"
            exit 1
          fi
        fi

        echo "${SINGBOX_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check
        tar -xzf "${ARCHIVE_PATH}"
        sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
        rm -rf "sing-box-${SINGBOX_VERSION}-linux-amd64"

    - name: Verify sing-box
      run: sing-box version



    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rust-src-dir: create/processor

    - name: Validate Rust pipeline
      env:
        CARGO_BUILD_JOBS: '1'
      run: |
        cargo fmt --manifest-path create/processor/Cargo.toml -- --check
        cargo clippy --manifest-path create/processor/Cargo.toml --all-targets -- -D warnings
        cargo test --manifest-path create/processor/Cargo.toml --all-targets -- --test-threads=1

    - name: Execute Rust Ruleset Update
      run: |
        cargo run --release --manifest-path create/processor/Cargo.toml --bin update -- \
          --root "$GITHUB_WORKSPACE" --unattended --singbox /usr/local/bin/sing-box
      env:
        CI: 'true'
        GITHUB_ACTIONS: 'true'
        CARGO_BUILD_JOBS: '1'
        SCRIPTHUB_DOWNLOAD_CONCURRENCY: '4'

    - name: Validate generated modules
      run: cargo run --manifest-path create/processor/Cargo.toml --bin validate -- --root "$GITHUB_WORKSPACE"

    - name: Publish generated tree
      if: github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git fetch origin master
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
          echo "::error::origin/master advanced during generation; refusing to publish stale artifacts"
          exit 1
        fi
        git add modules rulesets
        if [ -d dns ]; then git add dns; fi
        if git diff --cached --quiet; then
          echo "No generated changes to publish."
          exit 0
        fi
        git commit -m "chore(ruleset): automated Rust update $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master

    - name: Summary
      env:
        PUBLISH_ENABLED: ${{ github.ref == 'refs/heads/master' }}
      run: |
        # shellcheck disable=SC2129
        echo "## 📊 Update Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### 📁 File Statistics" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Category | Count |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| MetaCubeX Rules | $(find rulesets/Sources/MetaCubeX -name '*.list' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| RULE-SET Rules | $(find rulesets/RULE-SET -name '*.list' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| AdBlock Split | $(find rulesets/AdBlock -name '*.list' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| SingBox SRS | $(find rulesets/SingBox rulesets/Sources/dns/mapping -name '*.srs' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Sources Files | $(find rulesets/Sources/Links -name '*_sources*' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Surge Modules | $(find modules/surge -name '*.sgmodule' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| SR Modules | $(find modules/shadowrocket -name '*.module' 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### 🔑 Key Rulesets" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ -d "rulesets/AdBlock" ]; then
          ADBLOCK_TOTAL=$(grep -hcv "^#\|^$" rulesets/AdBlock/*.list 2>/dev/null | awk '{s+=$1} END {print s}' || echo "0")
          echo "- **AdBlock (Total Split)**: ${ADBLOCK_TOTAL} rules" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "rulesets/AdBlock/catalog.json" ]; then
          PROMAX_SHARDS=$(jq '[.shards[]?] | length' rulesets/AdBlock/catalog.json 2>/dev/null || echo "unknown")
          PROMAX_CATALOG_RULES=$(jq '[.shards[]?.rule_count // 0] | add // 0' rulesets/AdBlock/catalog.json 2>/dev/null || echo "unknown")
          echo "- **PROMAX Catalog**: ${PROMAX_SHARDS} shards / ${PROMAX_CATALOG_RULES} rules" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "rulesets/AdBlock/quarantine.json" ]; then
          PROMAX_QUARANTINE=$(jq 'length' rulesets/AdBlock/quarantine.json 2>/dev/null || echo "unknown")
          echo "- **PROMAX Quarantine**: ${PROMAX_QUARANTINE} rejected candidates" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "rulesets/RULE-SET/ChinaDirect.list" ]; then
          CHINADIRECT_COUNT=$(grep -cv "^#\|^$" "rulesets/RULE-SET/ChinaDirect.list" 2>/dev/null || echo "0")
          echo "- **ChinaDirect** (DNS leak prevention): ${CHINADIRECT_COUNT} rules" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "rulesets/RULE-SET/GlobalProxy.list" ]; then
          GLOBALPROXY_COUNT=$(grep -cv "^#\|^$" "rulesets/RULE-SET/GlobalProxy.list" 2>/dev/null || echo "0")
          echo "- **GlobalProxy**: ${GLOBALPROXY_COUNT} rules" >> "$GITHUB_STEP_SUMMARY"
        fi
        FIREWALL_MODULE=$(find modules/surge -name '*Firewall*' -o -name '*firewall*' 2>/dev/null | head -1)
        if [ -n "${FIREWALL_MODULE}" ]; then
          FIREWALL_COUNT=$(grep -c "^DEST-PORT\|^IN-PORT\|^SRC-PORT" "${FIREWALL_MODULE}" 2>/dev/null || echo "0")
          echo "- **Firewall** (port blocking): ${FIREWALL_COUNT} rules" >> "$GITHUB_STEP_SUMMARY"
        fi
        # shellcheck disable=SC2129
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### ⚙️ CI/CD Mode" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "✅ Ruleset update and merge" >> "$GITHUB_STEP_SUMMARY"
        echo "✅ Smart dedup and cleanup" >> "$GITHUB_STEP_SUMMARY"
        echo "✅ Port rules sync to firewall module" >> "$GITHUB_STEP_SUMMARY"
        echo "✅ SRS file generation" >> "$GITHUB_STEP_SUMMARY"
        echo "✅ PROMAX Rust validation passed (single-threaded)" >> "$GITHUB_STEP_SUMMARY"
        if [ "${PUBLISH_ENABLED}" = "true" ]; then
          echo "✅ Master publication enabled (github-actions[bot])" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "ℹ️ Validation-only run; commit and push disabled for ${GITHUB_REF}" >> "$GITHUB_STEP_SUMMARY"
        fi
        # shellcheck disable=SC2129
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "❌ Skip backup (CI=true)" >> "$GITHUB_STEP_SUMMARY"
        echo "❌ Skip core update (--unattended)" >> "$GITHUB_STEP_SUMMARY"
        echo "❌ Skip iCloud sync (--unattended)" >> "$GITHUB_STEP_SUMMARY"
        echo "❌ Skip Surge profile sync (--unattended)" >> "$GITHUB_STEP_SUMMARY"

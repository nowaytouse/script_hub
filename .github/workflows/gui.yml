name: Rust GUI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'crates/processor/**'
      - 'crates/dev/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/gui.yml'
      - 'LICENSE'
      - 'README*.md'
      - 'PRIVACY*.md'
      - 'SECURITY*.md'
      - 'THIRD_PARTY_NOTICES*.md'
      - 'rulesets/Sources/licenses/**'
  pull_request:
    paths:
      - 'crates/processor/**'
      - 'crates/dev/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/gui.yml'
      - 'LICENSE'
      - 'README*.md'
      - 'PRIVACY*.md'
      - 'SECURITY*.md'
      - 'THIRD_PARTY_NOTICES*.md'
      - 'rulesets/Sources/licenses/**'

permissions:
  contents: read

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: .
          toolchain: stable
          cache-workspaces: . -> target
          cache-shared-key: script-hub-processor
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: false
      - name: Read package version
        id: version
        shell: bash
        run: |
          package_id=$(cargo pkgid -p rust_processor)
          version=${package_id##*@}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features -- --test-threads=1
      - name: Verify generated system icons
        run: cargo icons --check
      - name: Build and package root application
        run: cargo app --archive
      - name: Worker smoke test without a display
        if: runner.os != 'Windows'
        run: ./ScriptHub.app/Contents/MacOS/script-hub-gui --worker validate --root .
      - name: Windows worker smoke test without a display
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'worker-validate.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'worker-validate.stderr.log'
          $worker = Start-Process -FilePath ./script-hub-gui.exe -ArgumentList '--worker','validate','--root','.' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          # This worker reads public repository artifacts, never private sessions.
          Get-Content $stdout,$stderr
          if ($worker.ExitCode -ne 0) { throw "GUI worker failed: $($worker.ExitCode)" }
      - name: Upload desktop executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: script-hub-gui-${{ steps.version.outputs.value }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/script-hub-gui-*.tar.gz
            target/script-hub-gui-*.zip
          if-no-files-found: error
          retention-days: 30

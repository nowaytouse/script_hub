[workspace]
members = ["crates/processor", "crates/dev"]
exclude = ["crates/grid"]
resolver = "3"

[workspace.package]
version = "0.14.9"

[profile.release]
strip = true
lto = true

[patch.crates-io]
# GPUI 0.2.2 pins Taffy 0.9.0, which requires the Grid 0.18 API.
# Forward that API to the fixed implementation for GHSA-38c5-483c-4qqp.
grid = { path = "crates/grid" }
